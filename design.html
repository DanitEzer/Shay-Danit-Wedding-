<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S✦D FEST — עיצוב</title>
<link href="https://fonts.googleapis.com/css2?family=Righteous&family=Rubik:wght@300;400;500;700&family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#faf8f5;--bg2:#f5f0ea;--bg3:#fff;--bg4:#f0ebe3;
  --border:#e8e0d5;--border2:#ddd4c8;
  --text:#2c1f14;--text2:#8a7060;--text3:#b09880;
  --accent:#c8763a;
  --green:#1a5c33;--green-bg:#f0f8f2;--green-border:#c8e6d4;
  --red:#9c3820;--red-bg:#fdf4f0;--red-border:#f0c8b8;
  --yellow:#8a6010;--yellow-bg:#fffbeb;--yellow-border:#fde68a;
  --blue:#1a4a8a;--blue-bg:#eff6ff;--blue-border:#bfdbfe;
  --purple:#6040a0;
}
body{background:var(--bg);font-family:Rubik,sans-serif;direction:rtl;min-height:100vh;color:var(--text)}

#name-modal{position:fixed;inset:0;background:rgba(44,31,20,.6);z-index:999;display:flex;align-items:center;justify-content:center}
#name-modal-inner{background:var(--bg3);border:0.5px solid var(--border);border-radius:12px;padding:2rem;width:90%;max-width:340px;text-align:center}
#name-modal h2{font-family:Righteous,cursive;font-size:1.4rem;color:var(--text);margin-bottom:.4rem}
#name-modal h2 span{color:var(--accent)}
#name-modal p{font-size:.82rem;color:var(--text2);margin-bottom:1.2rem}
#name-modal input{width:100%;padding:.65rem 1rem;border:0.5px solid var(--border);border-radius:6px;font-family:Rubik,sans-serif;font-size:.9rem;direction:rtl;outline:none;margin-bottom:.8rem;background:var(--bg)}
#name-modal input:focus{border-color:var(--accent)}
#name-modal button{width:100%;padding:.75rem;background:var(--accent);border:none;border-radius:6px;font-family:Righteous,cursive;font-size:1rem;color:#fff;cursor:pointer}

.topbar{background:var(--bg2);border-bottom:0.5px solid var(--border);padding:.85rem 1.5rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.logo{font-family:Righteous,cursive;font-size:1rem;color:var(--text);letter-spacing:.1em}
.logo span{color:var(--accent)}
.topbar-right{display:flex;align-items:center;gap:.75rem}
.countdown{font-family:'Barlow Condensed',sans-serif;font-size:.65rem;letter-spacing:.15em;color:var(--red);background:var(--red-bg);border:0.5px solid var(--red-border);padding:4px 10px;border-radius:20px}
.user-badge{font-family:'Barlow Condensed',sans-serif;font-size:.65rem;letter-spacing:.12em;color:var(--text2);background:var(--bg3);border:0.5px solid var(--border);padding:4px 10px;border-radius:20px;cursor:pointer}
.saved-msg{position:fixed;top:1rem;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:.35rem 1.1rem;border-radius:20px;font-family:'Barlow Condensed',sans-serif;font-size:.6rem;letter-spacing:.18em;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999}

.cmd-strip{display:flex;gap:.5rem;padding:.85rem 1.5rem;border-bottom:0.5px solid var(--border);background:var(--bg2);overflow-x:auto;scrollbar-width:none}
.cmd-strip::-webkit-scrollbar{display:none}
.cmd-card{background:var(--bg3);border:0.5px solid var(--border);border-radius:8px;padding:.6rem 1rem;flex-shrink:0;min-width:100px;text-align:center}
.cmd-card.warn{background:var(--yellow-bg);border-color:var(--yellow-border)}
.cmd-card.danger{background:var(--red-bg);border-color:var(--red-border)}
.cmd-card.ok{background:var(--green-bg);border-color:var(--green-border)}
.cmd-num{font-family:'Barlow Condensed',sans-serif;font-size:1.6rem;font-weight:700;line-height:1;color:var(--text)}
.cmd-card.warn .cmd-num{color:var(--yellow)}
.cmd-card.danger .cmd-num{color:var(--red)}
.cmd-card.ok .cmd-num{color:var(--green)}
.cmd-label{font-family:'Barlow Condensed',sans-serif;font-size:.5rem;letter-spacing:.18em;color:var(--text3);text-transform:uppercase;margin-top:.25rem}

.owner-strip{display:flex;gap:.4rem;padding:.6rem 1.5rem;border-bottom:0.5px solid var(--border);flex-wrap:wrap;align-items:center}
.owner-chip{font-family:'Barlow Condensed',sans-serif;font-size:.58rem;letter-spacing:.1em;padding:3px 10px;border-radius:20px;border:0.5px solid var(--border2);background:var(--bg3);color:var(--text2);cursor:pointer;display:flex;align-items:center;gap:5px;transition:all .15s}
.owner-chip .dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.owner-chip.active,.owner-chip:hover{background:var(--bg2);border-color:var(--accent);color:var(--accent)}
.owner-strip-label{font-family:'Barlow Condensed',sans-serif;font-size:.52rem;letter-spacing:.15em;color:var(--text3);text-transform:uppercase}

.tabs{display:flex;padding:0 1.5rem;border-bottom:0.5px solid var(--border)}
.tab{font-family:'Barlow Condensed',sans-serif;font-size:.65rem;letter-spacing:.18em;text-transform:uppercase;padding:.6rem 1.1rem;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-0.5px;background:none;border-top:none;border-left:none;border-right:none;transition:color .15s}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}

.search-bar{padding:.75rem 1.5rem;border-bottom:0.5px solid var(--border);display:flex;gap:.5rem;align-items:center}
.search-input{flex:1;padding:.4rem .8rem;border:0.5px solid var(--border2);border-radius:6px;font-family:Rubik,sans-serif;font-size:.8rem;background:var(--bg3);color:var(--text);direction:rtl;outline:none}
.search-input:focus{border-color:var(--accent)}
.add-zone-btn{font-family:'Barlow Condensed',sans-serif;font-size:.58rem;letter-spacing:.12em;padding:5px 12px;border-radius:20px;border:0.5px solid var(--accent);color:var(--accent);background:transparent;cursor:pointer;white-space:nowrap;transition:all .15s}
.add-zone-btn:hover{background:var(--accent);color:#fff}

.main{padding:1rem 1.5rem}

/* ZONE */
.zone-wrap{background:var(--bg3);border:0.5px solid var(--border);border-radius:10px;margin-bottom:.85rem;overflow:hidden}
.zone-head{padding:.9rem 1rem;background:var(--bg2);cursor:pointer;display:flex;align-items:flex-start;justify-content:space-between;gap:.5rem}
.zone-head-left{display:flex;align-items:flex-start;gap:.6rem;flex:1;min-width:0}
.zone-icon{font-size:1.2rem;flex-shrink:0;margin-top:1px}
.zone-info{flex:1;min-width:0}
.zone-name{font-size:.88rem;font-weight:500;color:var(--text);display:flex;align-items:center;gap:.4rem}
.zone-vibe{font-size:.72rem;color:var(--text3);font-style:italic;margin-top:2px}
.zone-desc-text{font-size:.78rem;color:var(--text2);line-height:1.7;margin-top:.4rem}
.zone-head-right{display:flex;flex-direction:column;align-items:flex-end;gap:.3rem;flex-shrink:0}
.zone-progress-label{font-family:'Barlow Condensed',sans-serif;font-size:.58rem;letter-spacing:.1em;color:var(--text3)}
.zone-actions{display:flex;gap:.3rem;opacity:0;transition:opacity .2s}
.zone-wrap:hover .zone-actions{opacity:1}
.zone-act-btn{font-size:.6rem;padding:2px 7px;border-radius:4px;border:0.5px solid var(--border2);background:var(--bg3);color:var(--text2);cursor:pointer;font-family:'Barlow Condensed',sans-serif;letter-spacing:.08em;transition:all .15s}
.zone-act-btn:hover{border-color:var(--red);color:var(--red)}
.zone-act-btn.edit-btn:hover{border-color:var(--accent);color:var(--accent)}
.prog-bar{height:2px;background:var(--border)}
.prog-fill{height:100%;background:var(--green);border-radius:1px;transition:width .3s}

/* TASK */
.task-list{padding:.4rem .75rem .6rem}
.task-row{border-bottom:0.5px solid var(--border);position:relative}
.task-row:last-child{border-bottom:none}
.task-row-main{display:flex;align-items:flex-start;gap:.5rem;padding:.4rem .3rem;border-radius:4px;transition:background .12s}
.task-row-main:hover{background:var(--bg2)}
.task-row.done .task-row-main{opacity:.4}
.task-row.urgent-row .task-row-main{background:var(--red-bg) !important}
.task-cb{width:14px;height:14px;margin-top:3px;flex-shrink:0;accent-color:var(--green);cursor:pointer}
.cat-pill{font-family:'Barlow Condensed',sans-serif;font-size:.5rem;letter-spacing:.07em;padding:2px 6px;border-radius:3px;flex-shrink:0;margin-top:3px;min-width:52px;text-align:center}
.cat-do{background:var(--green-bg);color:var(--green);border:0.5px solid var(--green-border)}
.cat-buy{background:var(--blue-bg);color:var(--blue);border:0.5px solid var(--blue-border)}
.cat-catering{background:var(--yellow-bg);color:var(--yellow);border:0.5px solid var(--yellow-border)}
.cat-decide{background:var(--bg2);color:var(--text2);border:0.5px solid var(--border2)}
.task-text{flex:1;font-size:.8rem;color:var(--text);line-height:1.4}
.task-text.done-text{text-decoration:line-through;color:var(--text3)}
.task-text-input{flex:1;font-size:.8rem;font-family:Rubik,sans-serif;color:var(--text);border:none;border-bottom:1px solid var(--accent);background:transparent;outline:none;line-height:1.4}
.task-row-actions{display:flex;align-items:center;gap:.3rem;opacity:0;transition:opacity .15s;flex-shrink:0}
.task-row-main:hover .task-row-actions{opacity:1}
.task-del{font-size:.65rem;color:var(--text3);cursor:pointer;padding:1px 4px;border-radius:3px;border:none;background:none;transition:color .15s}
.task-del:hover{color:var(--red)}
.task-edit-btn{font-size:.65rem;color:var(--text3);cursor:pointer;padding:1px 4px;border-radius:3px;border:none;background:none;transition:color .15s}
.task-edit-btn:hover{color:var(--accent)}
.notes-toggle{font-size:.62rem;color:var(--text3);cursor:pointer;padding:1px 5px;border-radius:3px;border:0.5px solid var(--border);background:none;transition:all .15s;font-family:'Barlow Condensed',sans-serif;letter-spacing:.05em}
.notes-toggle:hover{border-color:var(--accent);color:var(--accent)}
.notes-toggle.has-notes{color:var(--purple);border-color:var(--purple)}
.owner-select{font-family:'Barlow Condensed',sans-serif;font-size:.55rem;border:0.5px solid var(--border);border-radius:4px;padding:2px 4px;background:var(--bg2);color:var(--text2);direction:rtl;outline:none;cursor:pointer;flex-shrink:0;max-width:72px}
.owner-select:focus{border-color:var(--accent)}
.deadline-label{font-family:'Barlow Condensed',sans-serif;font-size:.52rem;color:var(--text3);flex-shrink:0;min-width:36px;text-align:center}
.deadline-label.soon{color:var(--yellow)}
.deadline-label.urgent{color:var(--red);font-weight:600}
.dep-dot{font-size:.6rem;color:var(--purple);flex-shrink:0;cursor:help}
.urgent-stripe{width:3px;position:absolute;right:0;top:2px;bottom:2px;background:var(--red);border-radius:2px}

/* NOTES */
.notes-area{padding:.3rem .3rem .5rem 1.8rem;display:none}
.notes-area.open{display:block}
.notes-textarea{width:100%;font-family:Rubik,sans-serif;font-size:.75rem;color:var(--text2);border:0.5px solid var(--border);border-radius:5px;padding:.4rem .6rem;background:var(--bg);resize:vertical;outline:none;min-height:52px;direction:rtl;line-height:1.6}
.notes-textarea:focus{border-color:var(--accent)}
.notes-textarea::placeholder{color:var(--text3)}
.notes-save-btn{margin-top:.3rem;font-family:'Barlow Condensed',sans-serif;font-size:.55rem;letter-spacing:.1em;padding:3px 9px;border-radius:4px;border:0.5px solid var(--green-border);color:var(--green);background:var(--green-bg);cursor:pointer;transition:all .15s}
.notes-save-btn:hover{background:var(--green);color:#fff}

/* ADD TASK */
.add-task-row{display:flex;gap:.5rem;align-items:center;padding:.5rem .3rem .3rem;margin-top:.1rem}
.add-task-input{flex:1;font-size:.78rem;font-family:Rubik,sans-serif;color:var(--text);border:none;border-bottom:0.5px dashed var(--border2);background:transparent;outline:none;direction:rtl;padding:.2rem 0}
.add-task-input::placeholder{color:var(--text3)}
.add-task-input:focus{border-bottom-color:var(--accent)}
.add-task-cat{font-family:'Barlow Condensed',sans-serif;font-size:.55rem;border:0.5px solid var(--border);border-radius:4px;padding:2px 4px;background:var(--bg2);color:var(--text2);direction:rtl;outline:none;cursor:pointer}
.add-task-btn{font-family:'Barlow Condensed',sans-serif;font-size:.58rem;letter-spacing:.1em;padding:3px 9px;border-radius:4px;border:0.5px solid var(--green-border);color:var(--green);background:var(--green-bg);cursor:pointer;flex-shrink:0;transition:all .15s}
.add-task-btn:hover{background:var(--green);color:#fff}

/* KANBAN */
.kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:.75rem;align-items:start}
.k-col{background:var(--bg3);border:0.5px solid var(--border);border-radius:8px;overflow:hidden;transition:border-color .15s}
.k-col.drag-over{border-color:var(--accent);background:var(--bg2)}
.k-head{padding:.6rem .85rem;border-bottom:0.5px solid var(--border);display:flex;justify-content:space-between;align-items:center;background:var(--bg2)}
.k-title{font-family:'Barlow Condensed',sans-serif;font-size:.6rem;letter-spacing:.18em;text-transform:uppercase}
.k-count{font-family:'Barlow Condensed',sans-serif;font-size:.6rem;color:var(--text3)}
.k-decide .k-title{color:var(--yellow)}
.k-buy .k-title{color:var(--blue)}
.k-do .k-title{color:var(--green)}
.k-catering .k-title{color:#8a6010}
.k-cards{padding:.5rem;display:flex;flex-direction:column;gap:.4rem;min-height:80px}
.k-card{background:var(--bg2);border:0.5px solid var(--border);border-radius:6px;padding:.5rem .65rem;cursor:grab;transition:box-shadow .15s,opacity .15s;user-select:none}
.k-card:active{cursor:grabbing}
.k-card.dragging{opacity:.4;box-shadow:0 4px 12px rgba(44,31,20,.15)}
.k-card.drag-placeholder{border:1px dashed var(--accent);background:var(--bg);opacity:.5;min-height:40px}
.k-card.done{opacity:.35}
.k-card.urgent{border-color:var(--red-border);background:var(--red-bg)}
.k-card-text{font-size:.75rem;color:var(--text);line-height:1.4;margin-bottom:.35rem}
.k-card.done .k-card-text{text-decoration:line-through;color:var(--text3)}
.k-card-meta{display:flex;align-items:center;gap:.35rem;flex-wrap:wrap}
.k-owner{font-family:'Barlow Condensed',sans-serif;font-size:.52rem;padding:1px 6px;border-radius:3px;border:0.5px solid}
.k-card-actions{display:flex;gap:.3rem;margin-top:.35rem;opacity:0;transition:opacity .15s}
.k-card:hover .k-card-actions{opacity:1}
.k-card-zone{font-family:'Barlow Condensed',sans-serif;font-size:.48rem;color:var(--text3);letter-spacing:.05em}
.k-move-select{font-family:'Barlow Condensed',sans-serif;font-size:.5rem;border:0.5px solid var(--border);border-radius:3px;padding:1px 3px;background:var(--bg3);color:var(--text2);direction:rtl;outline:none;cursor:pointer;margin-right:auto}
.k-move-select:focus{border-color:var(--accent)}

/* URGENT */
.urgent-section{background:var(--bg3);border:0.5px solid var(--red-border);border-radius:10px;overflow:hidden}
.urgent-head{padding:.7rem 1rem;background:var(--red-bg);border-bottom:0.5px solid var(--red-border)}
.urgent-title{font-family:'Barlow Condensed',sans-serif;font-size:.7rem;letter-spacing:.18em;color:var(--red);text-transform:uppercase}

/* BAGS */
.bags-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:.85rem}
.bag-card{background:var(--bg3);border:0.5px solid var(--border);border-radius:10px;overflow:hidden}
.bag-card-head{padding:.8rem 1rem;background:var(--bg2);display:flex;align-items:center;gap:.6rem;border-bottom:0.5px solid var(--border)}
.bag-number{font-family:'Barlow Condensed',sans-serif;font-size:.7rem;font-weight:700;letter-spacing:.1em;background:var(--accent);color:#fff;border-radius:4px;padding:2px 7px;flex-shrink:0}
.bag-icon{font-size:1.1rem;flex-shrink:0}
.bag-name{font-size:.88rem;font-weight:500;color:var(--text);flex:1}
.bag-status{font-family:'Barlow Condensed',sans-serif;font-size:.5rem;letter-spacing:.1em;padding:2px 7px;border-radius:20px;flex-shrink:0}
.bag-status.ready{background:var(--green-bg);color:var(--green);border:0.5px solid var(--green-border)}
.bag-status.missing{background:var(--yellow-bg);color:var(--yellow);border:0.5px solid var(--yellow-border)}
.bag-status.pending{background:var(--bg4);color:var(--text2);border:0.5px solid var(--border2)}
.bag-body{padding:.7rem 1rem}
.bag-section-label{font-family:'Barlow Condensed',sans-serif;font-size:.5rem;letter-spacing:.15em;color:var(--text3);text-transform:uppercase;margin-bottom:.4rem;margin-top:.6rem}
.bag-section-label:first-child{margin-top:0}
.bag-items{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:.3rem}
.bag-item-tag{font-size:.72rem;padding:2px 8px;border-radius:4px;border:0.5px solid var(--border2);color:var(--text2);background:var(--bg2);display:flex;align-items:center;gap:4px;cursor:pointer}
.bag-item-tag:hover .del-item{opacity:1}
.del-item{font-size:.6rem;color:var(--text3);opacity:0;transition:opacity .15s;cursor:pointer}
.del-item:hover{color:var(--red)}
.add-item-row{display:flex;gap:.4rem;margin-top:.3rem}
.add-item-input{flex:1;font-size:.75rem;font-family:Rubik,sans-serif;border:none;border-bottom:0.5px dashed var(--border2);background:transparent;outline:none;padding:.15rem 0;direction:rtl;color:var(--text)}
.add-item-input:focus{border-bottom-color:var(--accent)}
.add-item-input::placeholder{color:var(--text3)}
.add-item-btn{font-family:'Barlow Condensed',sans-serif;font-size:.52rem;padding:2px 7px;border-radius:4px;border:0.5px solid var(--green-border);color:var(--green);background:var(--green-bg);cursor:pointer}
.bag-task-row{display:flex;align-items:center;gap:.5rem;padding:3px 0;font-size:.75rem;color:var(--text2)}
.bag-task-cb{width:12px;height:12px;accent-color:var(--green);flex-shrink:0;cursor:pointer}
.bag-task-text{flex:1}
.bag-task-text.done{text-decoration:line-through;color:var(--text3)}
.del-bag-task{font-size:.6rem;color:var(--text3);opacity:0;border:none;background:none;cursor:pointer;padding:0 2px}
.bag-task-row:hover .del-bag-task{opacity:1}
.del-bag-task:hover{color:var(--red)}
.bag-actions{display:flex;gap:.4rem;padding:.5rem 1rem .7rem;border-top:0.5px solid var(--border);margin-top:.4rem}
.bag-act-btn{font-family:'Barlow Condensed',sans-serif;font-size:.52rem;letter-spacing:.08em;padding:3px 8px;border-radius:4px;border:0.5px solid var(--border2);color:var(--text2);background:none;cursor:pointer;transition:all .15s}
.bag-act-btn:hover{border-color:var(--accent);color:var(--accent)}
.bag-act-btn.del:hover{border-color:var(--red);color:var(--red)}
.bag-status-sel{font-family:'Barlow Condensed',sans-serif;font-size:.52rem;border:0.5px solid var(--border);border-radius:4px;padding:2px 4px;background:var(--bg2);color:var(--text2);direction:rtl;outline:none;cursor:pointer;margin-right:auto}
.add-bag-task-row{display:flex;gap:.4rem;margin-top:.4rem}
.add-bag-task-input{flex:1;font-size:.75rem;font-family:Rubik,sans-serif;border:none;border-bottom:0.5px dashed var(--border2);background:transparent;outline:none;padding:.15rem 0;direction:rtl;color:var(--text)}
.add-bag-task-input:focus{border-bottom-color:var(--accent)}
.add-bag-task-input::placeholder{color:var(--text3)}

@media(max-width:768px){
  .kanban{grid-template-columns:repeat(2,1fr)}
  .main{padding:.75rem 1rem}
  .cmd-strip,.owner-strip,.search-bar,.tabs{padding-left:1rem;padding-right:1rem}
  .bags-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div id="name-modal">
  <div id="name-modal-inner">
    <h2>S<span>✦</span>D FEST</h2>
    <p>מה שמך? כל עדכון יירשם על שמך</p>
    <input type="text" id="name-input" placeholder="שם..." autofocus>
    <button onclick="enterSite()">כניסה</button>
  </div>
</div>

<div class="saved-msg" id="saved-msg">✓ נשמר</div>

<div class="topbar">
  <div class="logo">S<span>✦</span>D FEST — עיצוב</div>
  <div class="topbar-right">
    <div class="countdown" id="countdown">טוען...</div>
    <div class="user-badge" id="user-badge" onclick="changeName()">👤 —</div>
  </div>
</div>

<div class="cmd-strip" id="cmd-strip"></div>
<div class="owner-strip" id="owner-strip"></div>
<div class="tabs">
  <button class="tab active" data-view="zones" onclick="switchView(this)">לפי אזור</button>
  <button class="tab" data-view="kanban" onclick="switchView(this)">קנבן</button>
  <button class="tab" data-view="urgent" onclick="switchView(this)">🔥 בוער</button>
  <button class="tab" data-view="bags" onclick="switchView(this)">🛍️ שקיות</button>
</div>
<div class="search-bar">
  <input class="search-input" id="search-input" placeholder="חיפוש..." oninput="render()">
  <button class="add-zone-btn" id="add-btn" onclick="addZone()">+ אזור חדש</button>
</div>

/* ---- HELPERS ---- */
function daysUntil(d){if(!d)return null;return Math.ceil((new Date(d)-new Date())/864e5);}
function dlInfo(deadline,isDone){
  if(!deadline||isDone)return null;
  var d=daysUntil(deadline);
  if(d<0)return{cls:'urgent',label:'פג!'};
  if(d===0)return{cls:'urgent',label:'היום'};
  if(d<=3)return{cls:'urgent',label:d+'י ⚠'};
  if(d<=7)return{cls:'soon',label:d+'י'};
  var dt=new Date(deadline);return{cls:'',label:(dt.getDate()+'/'+(dt.getMonth()+1))};
}
function filterTask(task){
  if(ownerFilter&&task.owner!==ownerFilter)return false;
  var q=(document.getElementById('search-input').value||'').trim().toLowerCase();
  if(q&&task.text.toLowerCase().indexOf(q)<0)return false;
  return true;
}
function findTask(id){
  for(var zi=0;zi<zones.length;zi++){
    for(var ti=0;ti<zones[zi].tasks.length;ti++){
      if(zones[zi].tasks[ti].id===id)return{task:zones[zi].tasks[ti],zi:zi,ti:ti,zone:zones[zi]};
    }
  }return null;
}
function updateCountdown(){
  var d=Math.floor((WEDDING-new Date())/864e5),h=Math.floor(((WEDDING-new Date())%864e5)/36e5);
  document.getElementById('countdown').textContent=d>0?('⏱ '+d+'d '+h+'h לחתונה'):'🎉 החתונה!';
}

/* ---- STRIPS ---- */
function buildCmdStrip(){
  var all=[];zones.forEach(function(z){z.tasks.forEach(function(t){all.push(t);});});
  var total=all.length,doneC=all.filter(function(t){return t.done;}).length,open=total-doneC;
  var urgent=all.filter(function(t){var d=daysUntil(t.deadline);return !t.done&&d!==null&&d<=5;}).length;
  var decide=all.filter(function(t){return !t.done&&t.cat==='decide';}).length;
  var days=Math.floor((WEDDING-new Date())/864e5);
  function card(num,label,cls){return '<div class="cmd-card'+(cls?' '+cls:'')+'"><div class="cmd-num">'+num+'</div><div class="cmd-label">'+label+'</div></div>';}
  document.getElementById('cmd-strip').innerHTML=
    card(days,'ימים לחתונה',days<=7?'danger':days<=14?'warn':'')+
    card(open,'פתוחות',open>15?'warn':'')+
    card(doneC+'/'+total,'הושלמו','ok')+
    card(urgent,'בוערות',urgent>0?'danger':'')+
    card(decide,'להחלטה',decide>4?'warn':'');
}

/* ---- DRAG & DROP (kanban) ---- */
function kDragStart(e,taskId){
  dragTaskId=taskId;
  e.dataTransfer.effectAllowed='move';
  setTimeout(function(){var el=document.querySelector('[data-task-id="'+taskId+'"]');if(el)el.classList.add('dragging');},0);
}
function kDragOver(e,col){e.preventDefault();col.classList.add('drag-over');}
function kDragLeave(col){col.classList.remove('drag-over');}
async function kDrop(e,col){
  e.preventDefault();col.classList.remove('drag-over');
  if(!dragTaskId)return;
  var newCat=col.dataset.cat;
  var f=findTask(dragTaskId);
  if(!f||f.task.cat===newCat){dragTaskId=null;return;}
  f.task.cat=newCat;
  await dbUpdate('design_tasks',dragTaskId,{cat:newCat,updated_at:new Date().toISOString()});
  showSaved();dragTaskId=null;renderKanban();
}
async function moveToCat(taskId,sel){
  var newCat=sel.value;if(!newCat)return;
  var f=findTask(taskId);if(!f)return;
  f.task.cat=newCat;
  await dbUpdate('design_tasks',taskId,{cat:newCat,updated_at:new Date().toISOString()});
  showSaved();renderKanban();
}

/* ---- URGENT ---- */
function renderUrgent(){
  var items=[];
  zones.forEach(function(z){z.tasks.forEach(function(t){
    var d=daysUntil(t.deadline);
    if(!t.done&&d!==null&&d<=7)items.push({t:t,d:d});
  });});
  items.sort(function(a,b){return a.d-b.d;});
  if(!items.length){document.getElementById('main-content').innerHTML='<div style="padding:3rem;text-align:center;color:var(--green);font-family:Barlow Condensed,sans-serif;letter-spacing:.2em;font-size:1.1rem">✓ אין משימות בוערות השבוע</div>';return;}
  var html='<div class="urgent-section"><div class="urgent-head"><span class="urgent-title">'+items.length+' משימות בוערות — השבוע</span></div><div class="task-list">';
  items.forEach(function(item){
    var t=item.t,dl=dlInfo(t.deadline,t.done);
    html+='<div class="task-row urgent-row"><div class="urgent-stripe"></div><div class="task-row-main">';
    html+='<input type="checkbox" class="task-cb" onchange="toggleTask(\''+t.id+'\',this)">';
    html+='<span class="cat-pill cat-'+t.cat+'">'+catLabels[t.cat]+'</span>';
    html+='<span class="task-text">'+t.text+'</span>';
    if(t.owner)html+='<span class="k-owner" style="border-color:'+OWNERS[t.owner]+';color:'+OWNERS[t.owner]+';background:'+OWNERS[t.owner]+'18;font-family:Barlow Condensed,sans-serif;font-size:.52rem;padding:1px 6px;border-radius:3px;border:0.5px solid;flex-shrink:0">'+t.owner+'</span>';
    if(t.dep)html+='<span class="dep-dot" title="'+t.dep+'">⬡</span>';

/* ---- ACTIONS ---- */
async function toggleTask(taskId,cb){
  var f=findTask(taskId);if(!f)return;
  f.task.done=cb.checked;
  await dbUpdate('design_tasks',taskId,{done:cb.checked,updated_at:new Date().toISOString()});
  showSaved();buildCmdStrip();render();
}
function toggleZone(zoneId){collapsed[zoneId]=!collapsed[zoneId];render();}

function toggleNotes(taskId){
  openNotes[taskId]=!openNotes[taskId];
  var area=document.getElementById('notes-'+taskId);
  if(area)area.classList.toggle('open',openNotes[taskId]);
}
async function saveNotes(taskId){
  var txt=document.getElementById('ntxt-'+taskId);if(!txt)return;
  var val=txt.value;
  var f=findTask(taskId);if(!f)return;
  f.task.notes=val;
  await dbUpdate('design_tasks',taskId,{notes:val,updated_at:new Date().toISOString()});
  showSaved();
  // refresh toggle button appearance
  var btn=document.querySelector('#trow-'+taskId+' .notes-toggle');
  if(btn){btn.textContent=val.trim()?'📝':'+ הערה';btn.classList.toggle('has-notes',!!val.trim());}
}

function editTaskInline(taskId){
  var row=document.getElementById('trow-'+taskId);if(!row)return;
  var textEl=row.querySelector('.task-text');if(!textEl)return;
  var f=findTask(taskId);if(!f)return;
  var old=f.task.text;
  var inp=document.createElement('input');inp.className='task-text-input';inp.value=old;
  textEl.replaceWith(inp);inp.focus();inp.select();
  var saved2=false;
  async function save(){
    if(saved2)return;saved2=true;
    var val=inp.value.trim();
    if(val&&val!==old){f.task.text=val;await dbUpdate('design_tasks',taskId,{text:val,updated_at:new Date().toISOString()});showSaved();}
    render();
  }
  inp.onblur=save;
  inp.onkeydown=function(e){if(e.key==='Enter'){e.preventDefault();save();}if(e.key==='Escape'){saved2=true;render();}};
}
async function deleteTask(e,taskId){
  e.stopPropagation();if(!confirm('למחוק?'))return;
  var f=findTask(taskId);if(!f)return;
  await dbDelete('design_tasks',taskId);
  zones[f.zi].tasks.splice(f.ti,1);
  showSaved();buildCmdStrip();render();
}
async function addTask(zoneId){
  var inp=document.getElementById('new-task-'+zoneId);
  var catSel=document.getElementById('new-cat-'+zoneId);
  var val=(inp?inp.value:'').trim();if(!val)return;
  var zone=zones.find(function(z){return z.id===zoneId;});if(!zone)return;
  var newT=await dbInsertTask(zoneId,val,catSel.value,zone.tasks.length);
  if(newT){zone.tasks.push({id:newT.id,zone_id:zoneId,text:val,cat:catSel.value,owner:'דנית',deadline:'',dep:'',notes:'',done:false,position:zone.tasks.length});showSaved();buildCmdStrip();render();
    setTimeout(function(){var el=document.getElementById('new-task-'+zoneId);if(el)el.focus();},80);}
}
function addTaskKey(e,zoneId){if(e.key==='Enter')addTask(zoneId);}
async function editZone(e,zoneId){
  e.stopPropagation();
  var zone=zones.find(function(z){return z.id===zoneId;});if(!zone)return;
  var name=prompt('שם האזור:',zone.name);if(!name||!name.trim())return;
  var vibe=prompt('תת-כותרת:',zone.vibe);
  var desc=prompt('תיאור:',zone.description);
  zone.name=name.trim();zone.vibe=vibe||'';zone.description=desc||'';
  await dbUpdate('design_zones',zoneId,{name:zone.name,vibe:zone.vibe,description:zone.description});
  showSaved();render();
}
async function deleteZone(e,zoneId){
  e.stopPropagation();
  var zone=zones.find(function(z){return z.id===zoneId;});if(!zone)return;
  if(!confirm('למחוק את האזור "'+zone.name+'"?'))return;
  await dbDelete('design_zones',zoneId);
  zones=zones.filter(function(z){return z.id!==zoneId;});
  showSaved();buildCmdStrip();render();
}
async function addZone(){
  var name=prompt('שם האזור:');if(!name||!name.trim())return;
  var icon=prompt('אמוג\'י:','✦');
  var vibe=prompt('תת-כותרת:','');
  var desc=prompt('תיאור:','');
  var newZ=await dbInsertZone(icon||'✦',name.trim(),vibe||'',desc||'',zones.length);
  if(newZ){zones.push({id:newZ.id,icon:newZ.icon,name:newZ.name,vibe:newZ.vibe,description:newZ.description,position:zones.length,tasks:[]});showSaved();render();}
}

/* ---- BAGS RENDER ---- */
function renderBags(){
  var q=(document.getElementById('search-input').value||'').trim().toLowerCase();
  var filtered=bags.filter(function(b){return !q||b.name.toLowerCase().indexOf(q)>=0||String(b.number).indexOf(q)>=0;});
  if(!filtered.length){document.getElementById('main-content').innerHTML='<div style="padding:2rem;text-align:center;color:var(--text3);font-family:Barlow Condensed,sans-serif;letter-spacing:.15em">אין שקיות עדיין</div>';return;}
  var statusLabels={ready:'מוכן להובלה',missing:'חסר משהו',pending:'ממתין להחלטה'};
  var html='<div class="bags-grid">';
  filtered.forEach(function(bag){
    var doneT=bag.tasks.filter(function(t){return t.done;}).length;
    html+='<div class="bag-card">';
    html+='<div class="bag-card-head">';
    html+='<span class="bag-number">#'+bag.number+'</span>';
    html+='<span class="bag-icon">'+bag.icon+'</span>';
    html+='<span class="bag-name">'+bag.name+'</span>';
    html+='<span class="bag-status '+bag.status+'">'+statusLabels[bag.status]+'</span>';
    html+='</div>';
    html+='<div class="bag-body">';
    // Items
    html+='<div class="bag-section-label">תכולה</div>';
    html+='<div class="bag-items" id="bitems-'+bag.id+'">';
    bag.items.forEach(function(item){
      html+='<span class="bag-item-tag" data-item-id="'+item.id+'">'+item.text+' <span class="del-item" onclick="delBagItem(\''+bag.id+'\',\''+item.id+'\')">✕</span></span>';
    });
    html+='</div>';
    html+='<div class="add-item-row"><input class="add-item-input" id="new-item-'+bag.id+'" placeholder="+ הוסף פריט..." onkeydown="addBagItemKey(event,\''+bag.id+'\')"><button class="add-item-btn" onclick="addBagItem(\''+bag.id+'\')">הוסף</button></div>';
    // Tasks
    html+='<div class="bag-section-label" style="margin-top:.7rem">משימות ('+doneT+'/'+bag.tasks.length+')</div>';
    bag.tasks.forEach(function(task){
      html+='<div class="bag-task-row"><input type="checkbox" class="bag-task-cb"'+(task.done?' checked':'')+' onchange="toggleBagTask(\''+bag.id+'\',\''+task.id+'\',this)"><span class="bag-task-text'+(task.done?' done':'')+'">'+task.text+'</span><button class="del-bag-task" onclick="delBagTask(\''+bag.id+'\',\''+task.id+'\')">✕</button></div>';
    });
    html+='<div class="add-bag-task-row"><input class="add-bag-task-input" id="new-btask-'+bag.id+'" placeholder="+ הוסף משימה..." onkeydown="addBagTaskKey(event,\''+bag.id+'\')"></div>';
    html+='</div>';
    // Actions
    html+='<div class="bag-actions">';
    html+='<select class="bag-status-sel" onchange="updateBagStatus(\''+bag.id+'\',this.value)">';
    Object.keys(statusLabels).forEach(function(s){html+='<option value="'+s+'"'+(bag.status===s?' selected':'')+'>'+statusLabels[s]+'</option>';});
    html+='</select>';
    html+='<button class="bag-act-btn" onclick="editBagName(\''+bag.id+'\')">✎ עריכה</button>';
    html+='<button class="bag-act-btn del" onclick="deleteBag(\''+bag.id+'\')">מחיקה</button>';
    html+='</div>';
    html+='</div>';
  });
  html+='</div>';
  document.getElementById('main-content').innerHTML=html;
}

/* ---- BAGS CRUD ---- */
async function addBag(){
  var num=prompt('מספר שקית:');if(!num||isNaN(num))return;
  var name=prompt('שם השקית:');if(!name||!name.trim())return;
  var icon=prompt('אמוג\'י:','🛍️');
  var {data}=await sb.from('design_bags').insert([{number:parseInt(num),icon:icon||'🛍️',name:name.trim(),status:'pending',notes:'',position:bags.length}]).select().single();
  if(data){bags.push({id:data.id,number:data.number,icon:data.icon,name:data.name,status:'pending',notes:'',position:bags.length,items:[],tasks:[]});showSaved();renderBags();}
}
async function editBagName(bagId){
  var bag=bags.find(function(b){return b.id===bagId;});if(!bag)return;
  var num=prompt('מספר שקית:',bag.number);
  var name=prompt('שם:',bag.name);if(!name||!name.trim())return;
  var icon=prompt('אמוג\'י:',bag.icon);
  bag.number=parseInt(num)||bag.number;bag.name=name.trim();bag.icon=icon||bag.icon;
  await dbUpdate('design_bags',bagId,{number:bag.number,name:bag.name,icon:bag.icon});
  showSaved();renderBags();
}
async function deleteBag(bagId){
  if(!confirm('למחוק את השקית?'))return;
  await dbDelete('design_bags',bagId);
  bags=bags.filter(function(b){return b.id!==bagId;});
  showSaved();renderBags();
}
async function updateBagStatus(bagId,status){
  var bag=bags.find(function(b){return b.id===bagId;});if(!bag)return;
  bag.status=status;
  await dbUpdate('design_bags',bagId,{status:status});
  showSaved();renderBags();
}
async function addBagItem(bagId){
  var inp=document.getElementById('new-item-'+bagId);
  var val=(inp?inp.value:'').trim();if(!val)return;
  var bag=bags.find(function(b){return b.id===bagId;});if(!bag)return;
  var {data}=await sb.from('design_bag_items').insert([{bag_id:bagId,text:val,position:bag.items.length}]).select().single();
  if(data){bag.items.push({id:data.id,text:val,position:bag.items.length});showSaved();renderBags();
    setTimeout(function(){var el=document.getElementById('new-item-'+bagId);if(el)el.focus();},80);}
}
function addBagItemKey(e,bagId){if(e.key==='Enter')addBagItem(bagId);}
async function delBagItem(bagId,itemId){
  await dbDelete('design_bag_items',itemId);
  var bag=bags.find(function(b){return b.id===bagId;});
  if(bag)bag.items=bag.items.filter(function(i){return i.id!==itemId;});
  showSaved();renderBags();
}
async function addBagTask(bagId){
  var inp=document.getElementById('new-btask-'+bagId);
  var val=(inp?inp.value:'').trim();if(!val)return;
  var bag=bags.find(function(b){return b.id===bagId;});if(!bag)return;
  var {data}=await sb.from('design_bag_tasks').insert([{bag_id:bagId,text:val,done:false,position:bag.tasks.length}]).select().single();
  if(data){bag.tasks.push({id:data.id,text:val,done:false,position:bag.tasks.length});showSaved();renderBags();
    setTimeout(function(){var el=document.getElementById('new-btask-'+bagId);if(el)el.focus();},80);}
}
function addBagTaskKey(e,bagId){if(e.key==='Enter')addBagTask(bagId);}
async function toggleBagTask(bagId,taskId,cb){
  var bag=bags.find(function(b){return b.id===bagId;});if(!bag)return;
  var task=bag.tasks.find(function(t){return t.id===taskId;});if(!task)return;
  task.done=cb.checked;
  await dbUpdate('design_bag_tasks',taskId,{done:cb.checked});
  showSaved();renderBags();
}
async function delBagTask(bagId,taskId){
  await dbDelete('design_bag_tasks',taskId);
  var bag=bags.find(function(b){return b.id===bagId;});
  if(bag)bag.tasks=bag.tasks.filter(function(t){return t.id!==taskId;});
  showSaved();renderBags();
}

function render(){
  buildCmdStrip();
  if(currentView==='zones')renderZones();
  else if(currentView==='kanban')renderKanban();
  else if(currentView==='bags')renderBags();
  else renderUrgent();
}
async function init(){
  updateCountdown();setInterval(updateCountdown,60000);
  buildOwnerStrip();
  await loadFromDB();
}
var sn=localStorage.getItem('snd_design_user');
if(sn){currentUser=sn;document.getElementById('name-modal').style.display='none';document.getElementById('user-badge').textContent='👤 '+sn;init();}
</script>
</body>
