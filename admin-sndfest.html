<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S&D FEST — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Righteous&family=Rubik:wght@300;400;700&family=Barlow+Condensed:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#F2E8D5;font-family:Rubik,sans-serif;direction:rtl;font-size:14px;padding:1rem}
.topbar{background:#3D1F08;padding:1rem 1.5rem;display:flex;align-items:center;justify-content:space-between;border-radius:8px;margin-bottom:1rem}
.topbar-logo{font-family:Righteous,cursive;font-size:1.4rem;color:#FAF3E0}
.topbar-logo span{color:#E8A820}
.tabs{display:flex;gap:0;border-bottom:3px solid #3D1F08;margin-bottom:1rem}
.tab{padding:.7rem 1.2rem;font-family:Barlow Condensed,sans-serif;font-size:.75rem;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;color:#8B6A4A;border-bottom:3px solid transparent;margin-bottom:-3px;background:none;border-top:none;border-left:none;border-right:none}
.tab.active{color:#D4581A;border-bottom-color:#D4581A}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:.8rem;margin-bottom:1.2rem}
.stat{background:#3D1F08;border-radius:8px;padding:1rem;text-align:center;border:2px solid #D4581A}
.stat-num{font-family:Righteous,cursive;font-size:1.8rem;color:#E8A820;display:block}
.stat-label{font-family:Barlow Condensed,sans-serif;font-size:.55rem;letter-spacing:.2em;color:rgba(242,232,213,.5);text-transform:uppercase;margin-top:.2rem;display:block}
.filters{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem;align-items:center}
.filters input,.filters select{padding:.5rem .8rem;border:2px solid #3D1F08;background:#FAF3E0;font-family:Rubik,sans-serif;font-size:.8rem;border-radius:4px;outline:none;direction:rtl}
.filters input{flex:1;min-width:150px}
.btn{padding:.5rem 1rem;font-family:Barlow Condensed,sans-serif;font-size:.65rem;letter-spacing:.15em;text-transform:uppercase;border:2px solid #3D1F08;border-radius:20px;cursor:pointer;background:#FAF3E0;transition:all .2s}
.btn:hover{background:#D4581A;color:#FAF3E0}
.table-wrap{background:#FAF3E0;border:3px solid #3D1F08;border-radius:8px;overflow:auto}
table{width:100%;border-collapse:collapse;min-width:700px}
th{background:#3D1F08;color:#E8A820;font-family:Barlow Condensed,sans-serif;font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;padding:.8rem;text-align:right;white-space:nowrap}
td{padding:.6rem .8rem;border-bottom:1px solid rgba(61,31,8,.1);vertical-align:middle}
tr:hover td{background:rgba(212,88,26,.05)}
select.inline{font-family:Rubik,sans-serif;font-size:.8rem;border:1px solid #ddd;border-radius:4px;padding:3px 6px;background:#fff;cursor:pointer;direction:rtl;max-width:130px}
.saved{position:fixed;top:1rem;left:50%;transform:translateX(-50%);background:#4BAE8A;color:#fff;padding:.4rem 1.2rem;border-radius:20px;font-family:Barlow Condensed,sans-serif;font-size:.7rem;letter-spacing:.15em;text-transform:uppercase;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-logo">S<span>&</span>D FEST</div>
  <div id="saved-msg" class="saved">&#10003; נשמר</div>
  <button class="btn" onclick="exportCSV()">ייצא CSV</button>
</div>

<div class="tabs">
  <button class="tab active" id="tab-guests-btn" onclick="window.switchTab('guests',this)">אישורי הגעה</button>
  <button class="tab" id="tab-lodging-btn" onclick="window.switchTab('lodging',this)">לינה</button>
</div>

<div id="pane-guests">
  <div class="stats" id="stats"></div>
  <div class="filters">
    <input type="text" id="search" placeholder="חיפוש שם..." oninput="applyFilter()">
    <select id="fgroup" onchange="applyFilter()">
      <option value="">כל הקבוצות</option>
      <option value="חברים">חברים</option>
      <option value="משפחה">משפחה</option>
      <option value="עבודה">עבודה</option>
      <option value="משפחת אייזנר">משפחת אייזנר</option>
      <option value="משפחת עזר">משפחת עזר</option>
      <option value="חברים של שי">חברים של שי</option>
      <option value="אופיר">אופיר</option>
      <option value="עדי">עדי</option>
      <option value="אלעד">אלעד</option>
      <option value="שיר">שיר</option>
    </select>
    <select id="fstatus" onchange="applyFilter()">
      <option value="">כל הסטטוסים</option>
      <option value="מגיע">מגיע</option>
      <option value="לא מגיע">לא מגיע</option>
      <option value="לא ענה">לא ענה</option>
      <option value="לא בטוח">לא בטוח</option>
    </select>
  </div>
  <div class="table-wrap">
    <table>
      <thead><tr>
        <th>שם</th>
        <th style="text-align:center">#</th>
        <th style="text-align:center">ילדים</th>
        <th style="text-align:center">STD</th>
        <th style="text-align:center">הזמנה</th>
        <th>סטטוס</th>
        <th>קבוצה</th>
        <th style="direction:ltr;text-align:left">טלפון</th>
      </tr></thead>
      <tbody id="gtable"></tbody>
    </table>
  </div>
</div>

<div id="pane-lodging" style="display:none">
  <div class="stats" id="lstats"></div>
  <div class="table-wrap" id="ltable"><p style="padding:1rem;color:#8B6A4A">טוען...</p></div>
</div>

var sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
var guests=JSON.parse(document.getElementById('gdata').textContent);

(function loadSaved(){
  try{var s=localStorage.getItem('snd_v4');if(s){var d=JSON.parse(s);guests=guests.map(function(g){var f=d.find(function(x){return x.id===g.id;});return f?Object.assign({},g,f):g;});}}catch(e){}
})();

function save(){
  try{localStorage.setItem('snd_v4',JSON.stringify(guests));}catch(e){}
  var m=document.getElementById('saved-msg');
  m.style.opacity='1';
  setTimeout(function(){m.style.opacity='0';},1500);
  renderStats();
}

window.update=function(id,field,val){
  var g=guests.find(function(x){return x.id===id;});
  if(g){g[field]=val;save();}
}

window.renderStats=function(){
  var coming=guests.filter(function(g){return g.status==='מגיע';});
  var nc=guests.filter(function(g){return g.status==='לא מגיע';});
  var unk=guests.filter(function(g){return g.status==='לא ענה';});
  var total=guests.reduce(function(s,g){return s+(g.count||0);},0);
  var cp=coming.reduce(function(s,g){return s+(g.count||0);},0);
  var items=[
    [guests.length+' / '+total,'הזמנות / אנשים','#D4581A'],
    [coming.length+' ('+cp+')','מגיעים','#4BAE8A'],
    [nc.length,'לא מגיעים','#C03020'],
    [unk.length,'לא ענו','#8B6A4A'],
    [guests.filter(function(g){return g.invitation;}).length,'קיבלו הזמנה','#E8A820'],
  ];
  var s=document.getElementById('stats');s.innerHTML='';
  items.forEach(function(item){
    var d=document.createElement('div');d.className='stat';d.style.borderColor=item[2];
    d.innerHTML='<span class="stat-num" style="color:'+item[2]+'">'+item[0]+'</span><span class="stat-label">'+item[1]+'</span>';
    s.appendChild(d);
  });
}

window.applyFilter=function(){
  var search=document.getElementById('search').value.toLowerCase();
  var fg=document.getElementById('fgroup').value;
  var fs=document.getElementById('fstatus').value;
  var list=guests.filter(function(g){
    if(search&&g.name.toLowerCase().indexOf(search)===-1)return false;
    if(fg&&g.group!==fg)return false;
    if(fs&&g.status!==fs)return false;
    return true;
  });
  var tb=document.getElementById('gtable');tb.innerHTML='';
  list.forEach(function(g){
    var tr=document.createElement('tr');
    if(g.uncertain)tr.style.opacity='0.5';
    var s1=document.createElement('select');s1.className='inline';
    ['מגיע','לא מגיע','לא ענה','לא בטוח'].forEach(function(st){
      var o=document.createElement('option');o.value=st;o.textContent=st;if(g.status===st)o.selected=true;s1.appendChild(o);
    });
    s1.onchange=function(){update(g.id,'status',this.value);};
    var ss=document.createElement('select');ss.className='inline';
    [['1','כן'],['0','לא']].forEach(function(opt){
      var o=document.createElement('option');o.value=opt[0];o.textContent=opt[1];if((g.save_date?'1':'0')===opt[0])o.selected=true;ss.appendChild(o);
    });
    ss.onchange=function(){update(g.id,'save_date',this.value==='1');};
    var si=document.createElement('select');si.className='inline';
    [['1','כן'],['0','לא']].forEach(function(opt){
      var o=document.createElement('option');o.value=opt[0];o.textContent=opt[1];if((g.invitation?'1':'0')===opt[0])o.selected=true;si.appendChild(o);
    });
    si.onchange=function(){update(g.id,'invitation',this.value==='1');};
    var cells=[
      g.name+(g.uncertain?' ?':''),
      g.count,
      g.kids||'-',
      '',
      '',
      '',
      g.group,
      g.phone||'-'
    ];
    cells.forEach(function(c,i){
      var td=document.createElement('td');
      if(i===3)td.appendChild(ss);
      else if(i===4)td.appendChild(si);
      else if(i===5)td.appendChild(s1);
      else{td.textContent=c;if(i===0&&g.uncertain)td.style.opacity='0.6';}
      if(i===1||i===2||i===3||i===4)td.style.textAlign='center';
      if(i===7){td.style.direction='ltr';td.style.textAlign='left';}
      tr.appendChild(td);
    });
    tb.appendChild(tr);
  });
}

window.switchTab=function(tab,btn){
  document.getElementById('pane-guests').style.display=tab==='guests'?'block':'none';
  document.getElementById('pane-lodging').style.display=tab==='lodging'?'block':'none';
  document.querySelectorAll('.tab').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  if(tab==='lodging')loadLodging();
}

  var thead=document.createElement('thead');
  var hrow=document.createElement('tr');
  ['שם','אנשים','סוג','הערות','תאריך'].forEach(function(h){var th=document.createElement('th');th.textContent=h;hrow.appendChild(th);});
  thead.appendChild(hrow);table.appendChild(thead);
  var tbody=document.createElement('tbody');
  var tm={shared:'משותף',private:'פרטי',sky:'כיפת שמיים'};
  data.forEach(function(r){
    var tr=document.createElement('tr');
    [r.name,r.guests,tm[r.type]||r.type,r.notes||'-',new Date(r.created_at).toLocaleDateString('he-IL')].forEach(function(v){var td=document.createElement('td');td.textContent=v;tr.appendChild(td);});
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  var w=document.getElementById('ltable');w.innerHTML='';w.appendChild(table);
}

window.exportCSV=function(){
  var rows=guests.map(function(g){return[g.name,g.count,g.kids||0,g.phone,g.save_date?1:0,g.invitation?1:0,g.status,g.group].join(',');});
  var csv='﻿שם,אנשים,ילדים,טלפון,STD,הזמנה,סטטוס,קבוצה
'+rows.join('
');
  var blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='snd_guests.csv';a.click();
}

document.addEventListener("DOMContentLoaded", function(){
  renderStats();
  applyFilter();
});
</script>
