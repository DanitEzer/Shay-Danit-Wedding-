<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S&D FEST — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Righteous&family=Rubik:wght@300;400;700&family=Barlow+Condensed:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#F2E8D5;font-family:'Rubik',sans-serif;direction:rtl;font-size:14px}

/* PASSWORD */
.pwd-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:1rem}
.pwd-screen h2{font-family:'Righteous',cursive;font-size:2rem;color:#3D1F08}
.pwd-screen input{padding:0.8rem 1.2rem;border:3px solid #3D1F08;border-radius:6px;font-family:'Rubik',sans-serif;font-size:1rem;outline:none;width:250px;text-align:center;direction:ltr}
.pwd-screen button{padding:0.7rem 2rem;background:#D4581A;border:2px solid #3D1F08;border-radius:20px;font-family:'Righteous',cursive;font-size:1rem;color:#FAF3E0;cursor:pointer}

/* LAYOUT */
.admin{display:none;min-height:100vh}
.topbar{background:#3D1F08;padding:1rem 1.5rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.topbar-logo{font-family:'Righteous',cursive;font-size:1.4rem;color:#FAF3E0}
.topbar-logo span{color:#E8A820}
.tabs{display:flex;gap:0;border-bottom:3px solid #3D1F08}
.tab{padding:0.8rem 1.5rem;font-family:'Barlow Condensed',sans-serif;font-size:0.75rem;letter-spacing:0.2em;text-transform:uppercase;cursor:pointer;color:#8B6A4A;border-bottom:3px solid transparent;margin-bottom:-3px;transition:all 0.2s}
.tab.active{color:#D4581A;border-bottom-color:#D4581A}
.tab-content{display:none;padding:1.5rem}
.tab-content.active{display:block}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:0.8rem;margin-bottom:1.5rem}
.stat{background:#3D1F08;border-radius:8px;padding:1rem;text-align:center;border:2px solid #D4581A}
.stat-num{font-family:'Righteous',cursive;font-size:2rem;color:#E8A820;display:block}
.stat-label{font-family:'Barlow Condensed',sans-serif;font-size:0.58rem;letter-spacing:0.2em;color:rgba(242,232,213,0.5);text-transform:uppercase;margin-top:0.2rem}

/* FILTERS */
.filters{display:flex;gap:0.5rem;flex-wrap:wrap;margin-bottom:1rem;align-items:center}
.filter-select{padding:0.5rem 0.8rem;border:2px solid #3D1F08;background:#FAF3E0;font-family:'Rubik',sans-serif;font-size:0.8rem;border-radius:4px;outline:none;direction:rtl}
.search-input{padding:0.5rem 0.8rem;border:2px solid #3D1F08;background:#FAF3E0;font-family:'Rubik',sans-serif;font-size:0.8rem;border-radius:4px;outline:none;flex:1;min-width:150px;direction:rtl}
.filter-btn{padding:0.5rem 1rem;font-family:'Barlow Condensed',sans-serif;font-size:0.65rem;letter-spacing:0.15em;text-transform:uppercase;border:2px solid #3D1F08;border-radius:20px;cursor:pointer;background:#FAF3E0;transition:all 0.2s}
.filter-btn.active{background:#D4581A;color:#FAF3E0;border-color:#D4581A}

/* TABLE */
.table-wrap{background:#FAF3E0;border:3px solid #3D1F08;border-radius:8px;overflow:auto}
table{width:100%;border-collapse:collapse;min-width:800px}
th{background:#3D1F08;color:#E8A820;font-family:'Barlow Condensed',sans-serif;font-size:0.65rem;letter-spacing:0.2em;text-transform:uppercase;padding:0.8rem;text-align:right;white-space:nowrap}
td{padding:0.6rem 0.8rem;border-bottom:1px solid rgba(61,31,8,0.1);vertical-align:middle}
tr:hover td{background:rgba(212,88,26,0.05)}
tr.uncertain td{opacity:0.5}

/* BADGES */
.badge{font-family:'Barlow Condensed',sans-serif;font-size:0.58rem;letter-spacing:0.1em;padding:2px 8px;border-radius:20px;text-transform:uppercase;white-space:nowrap}
.badge-coming{background:#4BAE8A;color:#fff}
.badge-notcoming{background:#C03020;color:#fff}
.badge-unknown{background:#8B6A4A;color:#fff}
.badge-unsure{background:#E8A820;color:#3D1F08}
.badge-question{background:#ddd;color:#666}
.badge-save-yes{background:#4BAE8A;color:#fff}
.badge-save-no{background:#ddd;color:#888}

/* SELECTS in table */
.status-select{font-family:'Rubik',sans-serif;font-size:0.8rem;border:1px solid #ddd;border-radius:4px;padding:3px 6px;background:#fff;outline:none;cursor:pointer;direction:rtl}
.check-select{font-family:'Rubik',sans-serif;font-size:0.8rem;border:1px solid #ddd;border-radius:4px;padding:3px 6px;background:#fff;cursor:pointer;direction:rtl}

/* LODGING TAB */
.lodging-table-wrap{background:#FAF3E0;border:3px solid #3D1F08;border-radius:8px;overflow:auto;margin-top:1rem}

/* SAVE BTN */
.save-indicator{font-family:'Barlow Condensed',sans-serif;font-size:0.65rem;letter-spacing:0.15em;text-transform:uppercase;padding:0.4rem 1rem;background:#4BAE8A;color:#fff;border:none;border-radius:20px;cursor:pointer;opacity:0;transition:opacity 0.3s}
.save-indicator.show{opacity:1}
</style>
</head>

<div class="pwd-screen" id="pwd-screen">

  <input type="password" id="pwd-input" placeholder="סיסמה" onkeydown="if(event.key==='Enter')checkPwd()">

<div class="admin" id="admin">

        <option>אופיר</option>
        <option>עדי</option>

        <option>שיר</option>

        <option>לא בטוח</option>
      </select>
      <button class="filter-btn" onclick="exportCSV()">ייצא CSV</button>
    </div>

    <div class="table-wrap">
      <table id="guests-table">
        <thead>
          <tr>
            <th>שם</th>
            <th>אנשים</th>
            <th>ילדים</th>
            <th>טלפון</th>
            <th>Save the Date</th>

            <th>סטטוס</th>
            <th>קבוצה</th>
          </tr>
        </thead>
        <tbody id="guests-tbody"></tbody>
      </table>
    </div>
  </div>

  <!-- LODGING TAB -->
  <div class="tab-content" id="tab-lodging">

      <div id="lodging-content" style="padding:2rem;text-align:center;color:#8B6A4A">טוען...</div>

  </div>
</div>

// Load saved state from localStorage
function loadState() {
  try {
    const saved = localStorage.getItem('snd_guests');
    if (saved) {
      const savedData = JSON.parse(saved);
      guests = guests.map(g => {
        const s = savedData.find(x => x.id === g.id);
        return s ? {...g, ...s} : g;
      });
    }
  } catch(e) {}
}

function saveState() {
  try {
    localStorage.setItem('snd_guests', JSON.stringify(guests));
    const btn = document.getElementById('save-btn');
    btn.classList.add('show');
    setTimeout(() => btn.classList.remove('show'), 2000);
  } catch(e) {}
}

function checkPwd() {
  if (document.getElementById('pwd-input').value === PASSWORD) {
    document.getElementById('pwd-screen').style.display = 'none';
    document.getElementById('admin').style.display = 'block';
    loadState();
    renderGuests(guests);
    updateStats();
    loadLodging();
  } else {
    document.getElementById('pwd-err').style.display = 'block';
  }
}

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', ['guests','lodging'][i] === tab));
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
}

function statusBadge(s) {
  const map = {'מגיע':'badge-coming','לא מגיע':'badge-notcoming','לא ענה':'badge-unknown','לא בטוח':'badge-unsure'};
  return '<span class="badge ' + (map[s]||'badge-question') + '">' + s + '</span>';
}

function renderGuests(list) {
  const tbody = document.getElementById('guests-tbody');
  tbody.innerHTML = list.map(g => `
    <tr class="${g.uncertain ? 'uncertain' : ''}">
      <td><strong>${g.name}</strong>${g.uncertain ? ' <span style="color:#E8A820;font-size:0.75rem">?</span>' : ''}</td>
      <td style="text-align:center">${g.count}</td>
      <td style="text-align:center">${g.kids || '—'}</td>
      <td style="direction:ltr;text-align:left;font-size:0.8rem">${g.phone || '—'}</td>
      <td style="text-align:center">
        <select class="check-select" onchange="updateGuest(${g.id},'save_date',this.value==='כן')">
          <option ${g.save_date ? 'selected' : ''}>כן</option>
          <option ${!g.save_date ? 'selected' : ''}>לא</option>
        </select>
      </td>
      <td style="text-align:center">
        <select class="check-select" onchange="updateGuest(${g.id},'invitation',this.value==='כן')">
          <option ${g.invitation ? 'selected' : ''}>כן</option>
          <option ${!g.invitation ? 'selected' : ''}>לא</option>
        </select>
      </td>
      <td>
        <select class="status-select" onchange="updateGuest(${g.id},'status',this.value)">
          <option ${g.status==='מגיע'?'selected':''}>מגיע</option>
          <option ${g.status==='לא מגיע'?'selected':''}>לא מגיע</option>
          <option ${g.status==='לא ענה'?'selected':''}>לא ענה</option>
          <option ${g.status==='לא בטוח'?'selected':''}>לא בטוח</option>
        </select>
      </td>
      <td><span class="badge" style="background:#F2E8D5;color:#3D1F08;border:1px solid #ddd">${g.group}</span></td>
    </tr>
  `).join('');
}

function updateGuest(id, field, value) {
  const g = guests.find(x => x.id === id);
  if (g) { g[field] = value; saveState(); updateStats(); }
}

function updateStats() {
  const coming = guests.filter(g => g.status === 'מגיע');
  const notComing = guests.filter(g => g.status === 'לא מגיע');
  const unknown = guests.filter(g => g.status === 'לא ענה');
  const totalPeople = coming.reduce((s,g) => s + (g.count||0), 0);
  const invited = guests.filter(g => g.invitation).length;

  document.getElementById('stats').innerHTML = `
    <div class="stat"><span class="stat-num">${guests.length}</span><span class="stat-label">סה״כ הזמנות</span></div>
    <div class="stat"><span class="stat-num">${guests.reduce((s,g)=>s+(g.count||0),0)}</span><span class="stat-label">סה״כ אנשים</span></div>
    <div class="stat" style="border-color:#4BAE8A"><span class="stat-num" style="color:#4BAE8A">${coming.length}</span><span class="stat-label">מגיעים (הזמנות)</span></div>
    <div class="stat" style="border-color:#4BAE8A"><span class="stat-num" style="color:#4BAE8A">${totalPeople}</span><span class="stat-label">מגיעים (אנשים)</span></div>
    <div class="stat" style="border-color:#C03020"><span class="stat-num" style="color:#C03020">${notComing.length}</span><span class="stat-label">לא מגיעים</span></div>
    <div class="stat"><span class="stat-num">${unknown.length}</span><span class="stat-label">לא ענו</span></div>
    <div class="stat" style="border-color:#E8A820"><span class="stat-num" style="color:#E8A820">${invited}</span><span class="stat-label">קיבלו הזמנה</span></div>
  `;
}

function filterGuests() {
  const search = document.getElementById('search-input').value.toLowerCase();
  const group = document.getElementById('filter-group').value;
  const status = document.getElementById('filter-status').value;
  
  const filtered = guests.filter(g => {
    if (search && !g.name.toLowerCase().includes(search)) return false;
    if (group && g.group !== group) return false;
    if (status && g.status !== status) return false;
    return true;
  });
  renderGuests(filtered);
}

function exportCSV() {
  const headers = ['שם','אנשים','ילדים','טלפון','Save the Date','הזמנה','סטטוס','קבוצה'];
  const rows = guests.map(g => [g.name, g.count, g.kids||0, g.phone, g.save_date?'כן':'לא', g.invitation?'כן':'לא', g.status, g.group]);
  const csv = [headers, ...rows].map(r => r.join(',')).join('
');
  const blob = new Blob(['﻿'+csv], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'snd_guests.csv';
  a.click();
}

// LODGING
async function loadLodging() {
  const res = await sb.from('lodging').select('*').order('created_at', {ascending:false});
  const data = res.data || [];
  
  const total = data.reduce((s,r) => s+(parseInt(r.guests)||0), 0);
  const shared = data.filter(r=>r.type==='shared').reduce((s,r)=>s+(parseInt(r.guests)||0),0);
  const priv = data.filter(r=>r.type==='private').reduce((s,r)=>s+(parseInt(r.guests)||0),0);

  document.getElementById('lodging-stats').innerHTML = `
    <div class="stat"><span class="stat-num">${total}</span><span class="stat-label">סה״כ ישנים</span></div>
    <div class="stat"><span class="stat-num">${data.length}</span><span class="stat-label">רשומות</span></div>
    <div class="stat" style="border-color:#E8A820"><span class="stat-num" style="color:#E8A820">${shared}</span><span class="stat-label">אוהל משותף</span></div>
    <div class="stat" style="border-color:#6BB5D6"><span class="stat-num" style="color:#6BB5D6">${priv}</span><span class="stat-label">אוהל פרטי</span></div>
  `;

  if (!data.length) {
    document.getElementById('lodging-content').textContent = 'אין רשומות עדיין 🏕️';
    return;
  }

  const typeLabel = t => t==='shared'?'אוהל משותף':t==='private'?'אוהל פרטי':'כיפת שמיים ⭐';
  const rows = data.map(r => `
    <tr>
      <td><strong>${r.name}</strong></td>
      <td style="text-align:center">${r.guests}</td>
      <td><span class="badge ${r.type==='shared'?'badge-unsure':r.type==='private'?'badge-coming':'badge-unknown'}">${typeLabel(r.type)}</span></td>
      <td style="font-size:0.8rem;color:#8B6A4A">${r.notes||'—'}</td>
      <td style="font-size:0.75rem;color:#8B6A4A">${new Date(r.created_at).toLocaleDateString('he-IL')}</td>
    </tr>
  `).join('');

  document.getElementById('lodging-content').innerHTML = `
    <table style="width:100%;border-collapse:collapse;min-width:600px">
      <thead><tr>
        <th style="background:#3D1F08;color:#E8A820;font-family:'Barlow Condensed',sans-serif;font-size:0.65rem;letter-spacing:0.2em;text-transform:uppercase;padding:0.8rem;text-align:right">שם</th>
        <th style="background:#3D1F08;color:#E8A820;font-family:'Barlow Condensed',sans-serif;font-size:0.65rem;letter-spacing:0.2em;text-transform:uppercase;padding:0.8rem;text-align:center">אנשים</th>
        <th style="background:#3D1F08;color:#E8A820;font-family:'Barlow Condensed',sans-serif;font-size:0.65rem;letter-spacing:0.2em;text-transform:uppercase;padding:0.8rem;text-align:right">סוג לינה</th>
        <th style="background:#3D1F08;color:#E8A820;font-family:'Barlow Condensed',sans-serif;font-size:0.65rem;letter-spacing:0.2em;text-transform:uppercase;padding:0.8rem;text-align:right">הערות</th>
        <th style="background:#3D1F08;color:#E8A820;font-family:'Barlow Condensed',sans-serif;font-size:0.65rem;letter-spacing:0.2em;text-transform:uppercase;padding:0.8rem;text-align:right">תאריך</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
  `;
}

document.getElementById('pwd-input').addEventListener('keydown', e => { if(e.key==='Enter') checkPwd(); });
