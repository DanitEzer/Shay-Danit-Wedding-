<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guest List</title>
<link href="https://fonts.googleapis.com/css2?family=Righteous&family=Rubik:wght@300;400;700&family=Barlow+Condensed:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#F2E8D5;font-family:Rubik,sans-serif;direction:rtl;font-size:14px;padding:1rem}
.topbar{background:#3D1F08;padding:1rem 1.5rem;display:flex;align-items:center;justify-content:space-between;border-radius:8px;margin-bottom:1rem}
.topbar-logo{font-family:Righteous,cursive;font-size:1.4rem;color:#FAF3E0}
.topbar-logo span{color:#E8A820}
.tabs{display:flex;border-bottom:3px solid #3D1F08;margin-bottom:1rem}
.tab{padding:.7rem 1.2rem;font-family:'Barlow Condensed',sans-serif;font-size:.75rem;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;color:#8B6A4A;border-bottom:3px solid transparent;margin-bottom:-3px;background:none;border-top:none;border-left:none;border-right:none}
.tab.active{color:#D4581A;border-bottom-color:#D4581A}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:.8rem;margin-bottom:1.2rem}
.stat{background:#3D1F08;border-radius:8px;padding:1rem;text-align:center;border:2px solid #D4581A;cursor:pointer;transition:opacity .2s}
.stat:hover{opacity:.85}
.stat.active-filter{box-shadow:0 0 0 3px #E8A820}
.stat-num{font-family:Righteous,cursive;font-size:1.8rem;color:#E8A820;display:block}
.stat-label{font-family:'Barlow Condensed',sans-serif;font-size:.55rem;letter-spacing:.2em;color:rgba(242,232,213,.5);text-transform:uppercase;margin-top:.2rem;display:block}
.filters{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem;align-items:center}
.filters input,.filters select{padding:.5rem .8rem;border:2px solid #3D1F08;background:#FAF3E0;font-family:Rubik,sans-serif;font-size:.8rem;border-radius:4px;outline:none;direction:rtl}
.filters input{flex:1;min-width:150px}
.btn{padding:.5rem 1rem;font-family:'Barlow Condensed',sans-serif;font-size:.65rem;letter-spacing:.15em;text-transform:uppercase;border:2px solid #3D1F08;border-radius:20px;cursor:pointer;background:#FAF3E0;transition:all .2s}
.btn:hover{background:#D4581A;color:#FAF3E0}
.table-wrap{background:#FAF3E0;border:3px solid #3D1F08;border-radius:8px;overflow:auto;max-height:70vh}
table{width:100%;border-collapse:collapse;min-width:750px}
th{background:#3D1F08;color:#E8A820;position:sticky;top:0;z-index:10;font-family:'Barlow Condensed',sans-serif;font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;padding:.8rem;text-align:right;white-space:nowrap;cursor:pointer;user-select:none}
th:hover{background:#5C3010}
th .sort-arrow{margin-right:4px;opacity:.5}
th.sorted .sort-arrow{opacity:1}
td{padding:.6rem .8rem;border-bottom:1px solid rgba(61,31,8,.1);vertical-align:middle}
tr:hover td{background:rgba(212,88,26,.05)}
select.inline{font-family:Rubik,sans-serif;font-size:.8rem;border:1px solid #ddd;border-radius:4px;padding:3px 6px;background:#fff;cursor:pointer;direction:rtl;max-width:130px}
.loading{text-align:center;padding:2rem;color:#8B6A4A;font-family:Righteous,cursive;font-size:1.2rem}
.saved-msg{position:fixed;top:1rem;left:50%;transform:translateX(-50%);background:#4BAE8A;color:#fff;padding:.4rem 1.2rem;border-radius:20px;font-family:'Barlow Condensed',sans-serif;font-size:.7rem;letter-spacing:.15em;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999}
@media(max-width:768px){
  table{font-size:10px;table-layout:fixed;width:100%}
  td,th{padding:3px 3px !important;white-space:nowrap}
  select.inline{font-size:10px !important;padding:1px 2px !important;max-width:70px !important}
  td:first-child,th:first-child{width:70px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  td:nth-child(2),th:nth-child(2){width:22px;text-align:center}
  td:nth-child(3),th:nth-child(3){width:22px;text-align:center}
  td:nth-child(4),th:nth-child(4){width:50px}
  td:nth-child(5),th:nth-child(5){width:80px}
  td:nth-child(6),th:nth-child(6){width:85px}
  td:nth-child(7),th:nth-child(7){width:45px;text-align:center}
  td:nth-child(8),th:nth-child(8){width:65px}
  .stat-num{font-size:1.1rem !important}
  .stat-label{font-size:0.45rem !important}
  .table-wrap{max-height:55vh}
  body{padding:.4rem}
  .topbar{padding:.6rem .8rem}
  .topbar-logo{font-size:1rem}
  .filters{gap:.3rem}
  .filters input,.filters select{font-size:.75rem;padding:.3rem .5rem}
  .btn{padding:.3rem .7rem;font-size:.6rem}
}
.compact table{font-size:11px;table-layout:fixed;width:100%}
.compact td,.compact th{padding:4px 5px}
.compact select.inline{font-size:11px;padding:2px 3px;max-width:90px}
.compact td:first-child{width:110px;word-break:break-word;white-space:normal}
.compact td:nth-child(2){width:28px}
.compact td:nth-child(3){width:45px}
.compact td:nth-child(4){width:100px}
.compact td:nth-child(5){width:120px}
.compact td:nth-child(6){width:80px}
.compact .stat-num{font-size:1.3rem}
.group-input{font-family:Rubik,sans-serif;font-size:.8rem;border:1px solid #ddd;border-radius:4px;padding:3px 6px;background:#fff;direction:rtl;width:110px}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-logo">S<span>&</span>D FEST</div>
  <div style="display:flex;gap:.5rem"><button class="btn" onclick="openNewGuest()" style="background:#4BAE8A;color:#fff;border-color:#4BAE8A">+ אורח חדש</button><button class="btn" id="compact-btn" onclick="toggleCompact()">📱 מובייל</button><button class="btn" onclick="exportCSV()">ייצא CSV</button></div>
</div>
<div class="saved-msg" id="saved-msg">&#10003; נשמר</div>

<div class="tabs">
  <button class="tab active" id="tab-btn-guests" onclick="showTab('guests')">אישורי הגעה</button>
  <button class="tab" id="tab-btn-lodging" onclick="showTab('lodging')">לינה</button>
  <button class="tab" id="tab-btn-rsvp" onclick="showTab('rsvp')">בקשות <span id="rsvp-badge" style="background:#C03020;color:#fff;border-radius:20px;padding:1px 7px;font-size:.65rem;display:none">0</span></button>
</div>

<div id="pane-guests">
  <div class="stats" id="stats"><div class="loading">טוען...</div></div>
  <div class="filters">
    <input type="text" id="search" placeholder="חיפוש שם..." oninput="renderTable()">
    <select id="fgroup" onchange="renderTable()">
      <option value="">כל הקבוצות</option>
      <option>חברים</option>
      <option>משפחה</option>
      <option>עבודה</option>
      <option>משפחת אייזנר</option>
      <option>משפחת עזר</option>
      <option>חברים של שי</option>
      <option>אופיר</option>
      <option>עדי</option>
      <option>אלעד</option>
      <option>שיר</option>
      <option value="__uncertain__">טרם הוזמן</option>
    </select>
    <select id="fstatus" onchange="renderTable()">
      <option value="">כל הסטטוסים</option>
      <option>מגיע</option>
      <option>לא מגיע</option>
      <option>טרם נשאל</option>
      <option>לא בטוח</option>
    </select>
    <button class="btn" onclick="clearFilters()">נקה סינון</button>
  </div>
  <div class="table-wrap">
    <div id="gtable"><div class="loading">טוען אורחים...</div></div>
  </div>
</div>

<div id="pane-lodging" style="display:none">
  <div class="stats" id="lstats"></div>
  <div class="table-wrap" id="ltable"><div class="loading">טוען...</div></div>
</div>

<div id="pane-rsvp" style="display:none">
  <div style="margin-bottom:1rem;font-family:Rubik,sans-serif;font-size:.85rem;color:#8B6A4A">
    בקשות ממתינות לאישור — בחרי את האורח המתאים ולחצי אשר.
  </div>
  <div id="rsvp-list"><div class="loading">טוען...</div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
var SB_URL = 'https://mvuachvkxkqwbpbzpczk.supabase.co';
var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im12dWFjaHZreGtxd2JwYnpwY3prIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY2NDMwMzIsImV4cCI6MjA5MjIxOTAzMn0.FIOx0kVsjY7UzchC7OJDGVr3fUBjjVZ4pfwBA8JyCJU';
var sb = supabase.createClient(SB_URL, SB_KEY);
var guests = [];
var lodgingData = [];
var sortCol = 'id';
var sortAsc = true;
var activeStatFilter = null;

async function init() {
  var res = await sb.from('guests').select('*').order('id');
  if (res.error) { document.getElementById('gtable').innerHTML = '<div class="loading">שגיאה בטעינת נתונים</div>'; return; }
  guests = res.data;
  var lRes = await sb.from('lodging').select('name,guests,type');
  lodgingData = lRes.data || [];
  renderStats();
  renderTable();
}

function showSaved() {
  var m = document.getElementById('saved-msg');
  m.style.opacity = '1';
  setTimeout(function() { m.style.opacity = '0'; }, 1500);
}

async function updateGuest(id, field, val) {
  var update = {};
  update[field] = val;
  await sb.from('guests').update(update).eq('id', id);
  var g = guests.find(function(x) { return x.id === id; });
  if (g) g[field] = val;
  showSaved();
  renderStats();
}

function filterByStatus(status) {
  if (activeStatFilter === status) {
    activeStatFilter = null;
    document.getElementById('fstatus').value = '';
  } else {
    activeStatFilter = status;
    document.getElementById('fstatus').value = status;
  }
  renderStats();
  renderTable();
}

function renderStats() {
  var coming = guests.filter(function(g) { return g.status === 'מגיע'; });
  var nc = guests.filter(function(g) { return g.status === 'לא מגיע'; });
  var unk = guests.filter(function(g) { return g.status === 'לא ענה' || g.status === 'טרם נשאל'; });
  var total = guests.reduce(function(s, g) { return s + (g.count || 0); }, 0);
  var cp = coming.reduce(function(s, g) { return s + (g.count || 0); }, 0);
  var inv = guests.filter(function(g) { return g.invitation; }).length;
  var totalKids = guests.reduce(function(s,g) { return s + (parseInt(g.kids)||0); }, 0);

  var items = [
    {num: guests.length + ' / ' + total, label: 'הזמנות / אנשים', color: '#D4581A', filter: null},
    {num: cp, label: 'מגיעים (אנשים)', color: '#4BAE8A', filter: 'מגיע'},
    {num: nc.length, label: 'לא מגיעים', color: '#C03020', filter: 'לא מגיע'},
    {num: unk.length, label: 'טרם נשאלו', color: '#8B6A4A', filter: 'טרם נשאל'},
    {num: inv, label: 'קיבלו הזמנה', color: '#E8A820', filter: null},
    {num: totalKids, label: 'ילדים', color: '#6BB5D6', filter: null},
  ];

  var s = document.getElementById('stats');
  s.innerHTML = '';
  items.forEach(function(item) {
    var d = document.createElement('div');
    d.className = 'stat' + (activeStatFilter === item.filter && item.filter ? ' active-filter' : '');
    d.style.borderColor = item.color;
    if (item.filter) d.onclick = function() { filterByStatus(item.filter); };
    d.innerHTML = '<span class="stat-num" style="color:' + item.color + '">' + item.num + '</span><span class="stat-label">' + item.label + '</span>';
    s.appendChild(d);
  });
}

function sortBy(col) {
  if (sortCol === col) sortAsc = !sortAsc;
  else { sortCol = col; sortAsc = true; }
  renderTable();
}

function getGroupList() {
  var base = ['חברים','משפחה','עבודה','משפחת אייזנר','משפחת עזר','חברים של שי','אופיר','עדי','אלעד','שיר'];
  var fromData = guests.map(function(g) { return g.group; }).filter(Boolean);
  fromData.forEach(function(g) { if (base.indexOf(g) === -1) base.push(g); });
  return base;
}

function addCustomGroup(name) {
  // Update filter dropdown
  var fgroup = document.getElementById('fgroup');
  var exists = Array.from(fgroup.options).some(function(o) { return o.value === name; });
  if (!exists) {
    var opt = document.createElement('option');
    opt.value = name; opt.textContent = name;
    fgroup.insertBefore(opt, fgroup.lastElementChild);
  }
}

function getFiltered() {
  var search = document.getElementById('search').value.toLowerCase();
  var fg = document.getElementById('fgroup').value;
  var fs = document.getElementById('fstatus').value;
  return guests.filter(function(g) {
    if (search && g.name.toLowerCase().indexOf(search) === -1) return false;
    if (fg === '__uncertain__' && !g.uncertain) return false;
    if (fg && fg !== '__uncertain__' && g.group !== fg) return false;
    if (fs && g.status !== fs) return false;
    return true;
  });
}

function renderTable() {
  var list = getFiltered();

  list.sort(function(a, b) {
    var av = a[sortCol], bv = b[sortCol];
    if (av === null || av === undefined) av = '';
    if (bv === null || bv === undefined) bv = '';
    if (typeof av === 'string') av = av.toLowerCase();
    if (typeof bv === 'string') bv = bv.toLowerCase();
    if (av < bv) return sortAsc ? -1 : 1;
    if (av > bv) return sortAsc ? 1 : -1;
    return 0;
  });

  var cols = [
    {label: 'שם', key: 'name'},
    {label: '#', key: 'count', center: true},
    {label: 'ילדים', key: 'kids', center: true},
    {label: 'הזמנה', key: 'invitation', center: true},
    {label: 'סטטוס', key: 'status'},
    {label: 'קבוצה', key: 'group'},
    {label: 'לינה', key: 'lodging', center: true},
    {label: 'טלפון', key: 'phone', ltr: true},
  ];

  var table = document.createElement('table');
  var thead = document.createElement('thead');
  var hrow = document.createElement('tr');
  cols.forEach(function(c) {
    var th = document.createElement('th');
    var arrow = sortCol === c.key ? (sortAsc ? ' ↑' : ' ↓') : ' ↕';
    th.innerHTML = c.label + '<span class="sort-arrow' + (sortCol === c.key ? ' sorted' : '') + '">' + arrow + '</span>';
    if (c.center) th.style.textAlign = 'center';
    if (c.ltr) { th.style.direction = 'ltr'; th.style.textAlign = 'left'; }
    th.onclick = (function(key) { return function() { sortBy(key); }; })(c.key);
    hrow.appendChild(th);
  });
  thead.appendChild(hrow);
  table.appendChild(thead);

  var tbody = document.createElement('tbody');
  var groups = ['חברים', 'משפחה', 'עבודה', 'משפחת אייזנר', 'משפחת עזר', 'חברים של שי', 'אופיר', 'עדי', 'אלעד', 'שיר'];

  list.forEach(function(g) {
    var tr = document.createElement('tr');
    if (g.uncertain) tr.style.opacity = '0.55';

    var makeBool = function(val, field) {
      var sel = document.createElement('select');
      sel.className = 'inline';
      [['1','כן'],['0','לא']].forEach(function(o) {
        var opt = document.createElement('option');
        opt.value = o[0]; opt.textContent = o[1];
        if ((val ? '1' : '0') === o[0]) opt.selected = true;
        sel.appendChild(opt);
      });
      sel.onchange = (function(id, f) { return function() { updateGuest(id, f, this.value === '1'); }; })(g.id, field);
      return sel;
    };

    var makeStatus = function(val) {
      var sel = document.createElement('select');
      sel.className = 'inline';
      [['מגיע','✓ מגיע'],['לא מגיע','✗ לא מגיע'],['טרם נשאל','⏳ טרם נשאל'],['לא בטוח','~ לא בטוח']].forEach(function(o) {
        var opt = document.createElement('option');
        opt.value = o[0]; opt.textContent = o[1];
        if (val === o[0]) opt.selected = true;
        sel.appendChild(opt);
      });
      sel.onchange = (function(id) { return function() { updateGuest(id, 'status', this.value); }; })(g.id);
      return sel;
    };

    var makeGroup = function(val) {
      var allGroups = getGroupList();
      var sel = document.createElement('select');
      sel.className = 'inline';
      sel.style.maxWidth = '140px';
      allGroups.forEach(function(grp) {
        var opt = document.createElement('option');
        opt.value = grp; opt.textContent = grp;
        if (val === grp) opt.selected = true;
        sel.appendChild(opt);
      });
      var customOpt = document.createElement('option');
      customOpt.value = '__custom__'; customOpt.textContent = '+ קבוצה חדשה';
      sel.appendChild(customOpt);
      if (!allGroups.includes(val) && val) {
        var existOpt = document.createElement('option');
        existOpt.value = val; existOpt.textContent = val; existOpt.selected = true;
        sel.insertBefore(existOpt, sel.firstChild);
      }
      sel.onchange = (function(id, s) { return function() {
        if (this.value === '__custom__') {
          var newGroup = prompt('שם הקבוצה החדשה:');
          if (newGroup && newGroup.trim()) {
            newGroup = newGroup.trim();
            addCustomGroup(newGroup);
            updateGuest(id, 'group', newGroup).then(function() { renderTable(); });
          } else {
            s.value = s.dataset.prev || '';
          }
        } else {
          s.dataset.prev = this.value;
          updateGuest(id, 'group', this.value);
        }
      }; })(g.id, sel);
      sel.dataset.prev = val;
      return sel;
    };

    var phone = g.phone || '';
    if (phone && !phone.startsWith('0')) phone = '0' + phone;

    // Find lodging for this guest
    var gLodging = lodgingData.filter(function(l) {
      return l.name && g.name && l.name.trim().toLowerCase() === g.name.trim().toLowerCase();
    });
    var lodgingText = gLodging.length > 0 ? 'כן — ' + gLodging.reduce(function(s,l){return s+(parseInt(l.guests)||0);},0) : 'לא';
    var lodgingColor = gLodging.length > 0 ? '#4BAE8A' : '#ccc';

    var cells = [
      {editable: true, field: 'name', val: g.name + (g.uncertain ? ' ?' : ''), bold: true},
      {editable: true, field: 'count', val: String(g.count), center: true, numeric: true},
      {editable: true, field: 'kids', val: String(g.kids || 0), center: true, numeric: true},
      {sel: makeBool(g.invitation, 'invitation'), center: true},
      {sel: makeStatus(g.status)},
      {sel: makeGroup(g.group)},
      {content: lodgingText, center: true, style: 'color:' + lodgingColor + ';font-weight:500;cursor:pointer', lodgingGuest: g},
      {editable: true, field: 'phone', val: phone, ltr: true, muted: true},
    ];

    cells.forEach(function(c) {
      var td = document.createElement('td');
      if (c.sel) td.appendChild(c.sel);
      else if (c.editable) {
        var span = document.createElement('span');
        var displayVal = c.val && c.val !== '-' && c.val !== '' ? c.val : '+ הוסף';
        span.textContent = displayVal;
        span.style.cssText = 'cursor:pointer;border-bottom:1px dashed #ccc;font-weight:' + (c.bold?'500':'400') + ';' + (displayVal === '+ הוסף' ? 'color:#D4581A;font-size:0.8rem;' : '');
        span.title = 'לחץ לעריכה';
        span.onclick = (function(id, field, s, ltr) { return function() {
          var input = document.createElement('input');
          input.type = 'text'; input.value = s.textContent;
          input.style.cssText = 'font-family:Rubik,sans-serif;font-size:.9rem;border:1px solid #D4581A;border-radius:4px;padding:2px 6px;width:150px;direction:'+(ltr?'ltr':'rtl')+';';
          td.replaceChild(input, s);
          input.focus();
          input.onblur = function() {
            var newVal = this.value.trim();
            if (newVal !== null && newVal !== undefined && newVal !== s.textContent) { var finalVal = numeric ? parseInt(newVal)||0 : newVal; updateGuest(id, field, finalVal); s.textContent = String(finalVal); }
            td.replaceChild(s, input);
          };
          input.onkeydown = function(e) { if (e.key==='Enter') this.blur(); if (e.key==='Escape') { td.replaceChild(s, input); } };
        }; })(g.id, c.field, span, c.ltr, c.numeric);
        td.appendChild(span);
      }
      else { td.textContent = c.content !== undefined ? c.content : ''; if (c.bold) td.style.fontWeight = '500'; if (c.style) td.style.cssText += ';' + c.style; }
      if (c.center) td.style.textAlign = 'center';
      if (c.ltr) { td.style.direction = 'ltr'; td.style.textAlign = 'left'; }
      if (c.muted) td.style.color = '#8B6A4A';
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  var wrap = document.getElementById('gtable');
  wrap.innerHTML = '';
  wrap.appendChild(table);
}

function clearFilters() {
  document.getElementById('search').value = '';
  document.getElementById('fgroup').value = '';
  document.getElementById('fstatus').value = '';
  activeStatFilter = null;
  renderStats();
  renderTable();
}

async function loadRSVP() {
  var res = await sb.from('rsvp_requests').select('*').eq('approved', false).order('created_at', {ascending: true});
  var data = res.data || [];
  
  var badge = document.getElementById('rsvp-badge');
  if (data.length > 0) { badge.style.display = 'inline'; badge.textContent = data.length; }
  else { badge.style.display = 'none'; }

  var wrap = document.getElementById('rsvp-list');
  if (!data.length) { wrap.innerHTML = '<div class="loading">אין בקשות ממתינות 🎉</div>'; return; }

  var table = document.createElement('table');
  table.style.minWidth = '600px';
  var thead = document.createElement('thead');
  var hrow = document.createElement('tr');
  ['שם', 'סטטוס', 'אנשים', 'הערה', 'תאריך', 'צמד ל', 'אשר'].forEach(function(h) {
    var th = document.createElement('th'); th.textContent = h; hrow.appendChild(th);
  });
  thead.appendChild(hrow); table.appendChild(thead);

  var tbody = document.createElement('tbody');
  data.forEach(function(r) {
    var tr = document.createElement('tr');

    var guestSel = document.createElement('select');
    guestSel.className = 'inline';
    guestSel.style.maxWidth = '150px';
    var defaultOpt = document.createElement('option');
    defaultOpt.value = ''; defaultOpt.textContent = 'בחרי אורח...';
    guestSel.appendChild(defaultOpt);
    guests.forEach(function(g) {
      var opt = document.createElement('option');
      opt.value = g.id; opt.textContent = g.name + ' (' + g.group + ')';
      guestSel.appendChild(opt);
    });

    var approveBtn = document.createElement('button');
    approveBtn.className = 'btn';
    approveBtn.textContent = '✓ אשר';
    approveBtn.style.cssText = 'padding:4px 12px;font-size:.65rem;';
    approveBtn.onclick = (function(rsvpId, sel, rsvpStatus) { return async function() {
      var guestId = sel.value;
      if (!guestId) { alert('בחרי אורח קודם'); return; }
      await sb.from('rsvp_requests').update({approved: true, linked_guest_id: parseInt(guestId)}).eq('id', rsvpId);
      await sb.from('guests').update({status: rsvpStatus}).eq('id', parseInt(guestId));
      loadRSVP();
      var g = guests.find(function(x) { return x.id === parseInt(guestId); });
      if (g) { g.status = rsvpStatus; renderStats(); renderTable(); }
      showSaved();
    }; })(r.id, guestSel, r.status);

    var d = new Date(r.created_at);
    var dateStr = d.toLocaleDateString('he-IL') + ' ' + d.toLocaleTimeString('he-IL', {hour:'2-digit',minute:'2-digit'});

    [r.name, r.status, r.guests_count, r.notes||'-', dateStr, guestSel, approveBtn].forEach(function(v) {
      var td = document.createElement('td');
      if (v instanceof HTMLElement) td.appendChild(v);
      else td.textContent = v;
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  wrap.innerHTML = '';
  var tableWrap = document.createElement('div');
  tableWrap.className = 'table-wrap';
  tableWrap.appendChild(table);
  wrap.appendChild(tableWrap);
}

function showTab(tab) {
  document.getElementById('pane-guests').style.display = tab === 'guests' ? 'block' : 'none';
  document.getElementById('pane-lodging').style.display = tab === 'lodging' ? 'block' : 'none';
  document.getElementById('tab-btn-guests').classList.toggle('active', tab === 'guests');
  document.getElementById('tab-btn-lodging').classList.toggle('active', tab === 'lodging');
  document.getElementById('tab-btn-rsvp').classList.toggle('active', tab === 'rsvp');
  document.getElementById('pane-rsvp').style.display = tab === 'rsvp' ? 'block' : 'none';
  if (tab === 'lodging') loadLodging();
  if (tab === 'rsvp') loadRSVP();
}

async function loadLodging() {
  var res = await sb.from('lodging').select('*').order('created_at', {ascending: false});
  var data = res.data || [];
  var total = data.reduce(function(s, r) { return s + (parseInt(r.guests) || 0); }, 0);
  var shared = data.filter(function(r) { return r.type === 'shared'; }).reduce(function(s, r) { return s + (parseInt(r.guests) || 0); }, 0);
  var priv = data.filter(function(r) { return r.type === 'private'; }).reduce(function(s, r) { return s + (parseInt(r.guests) || 0); }, 0);
  var ls = document.getElementById('lstats');
  ls.innerHTML = '';
  [[total,'סהכ ישנים','#D4581A'],[data.length,'רשומות','#D4581A'],[shared,'אוהל משותף','#E8A820'],[priv,'אוהל פרטי','#6BB5D6']].forEach(function(item) {
    var d = document.createElement('div'); d.className = 'stat'; d.style.borderColor = item[2];
    d.innerHTML = '<span class="stat-num" style="color:' + item[2] + '">' + item[0] + '</span><span class="stat-label">' + item[1] + '</span>';
    ls.appendChild(d);
  });
  if (!data.length) { document.getElementById('ltable').innerHTML = '<div class="loading">אין רשומות עדיין</div>'; return; }
  var table = document.createElement('table');
  var thead = document.createElement('thead');
  var hrow = document.createElement('tr');
  ['שם','אנשים','סוג','הערות','תאריך'].forEach(function(h) { var th = document.createElement('th'); th.textContent = h; hrow.appendChild(th); });
  thead.appendChild(hrow); table.appendChild(thead);
  var tbody = document.createElement('tbody');
  var tm = {shared:'משותף', private:'פרטי', sky:'כיפת שמיים'};
  data.forEach(function(r) {
    var tr = document.createElement('tr');
    [r.name, r.guests, tm[r.type]||r.type, r.notes||'-', new Date(r.created_at).toLocaleDateString('he-IL')].forEach(function(v) {
      var td = document.createElement('td'); td.textContent = v; tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  var w = document.getElementById('ltable'); w.innerHTML = ''; w.appendChild(table);
}

function exportCSV() {
  var list = getFiltered();
  var rows = list.map(function(g) {
    var phone = g.phone || '';
    if (phone && !phone.startsWith('0')) phone = '0' + phone;
    return [g.name, g.count, g.kids||0, phone, g.save_date?1:0, g.invitation?1:0, g.status, g.group].join(',');
  });
  var csv = '\uFEFFשם,אנשים,ילדים,טלפון,STD,הזמנה,סטטוס,קבוצה\n' + rows.join('\n');
  var blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'snd_guests.csv'; a.click();
}


function openNewGuest() {
  var modal = document.getElementById('new-guest-modal');
  modal.style.display = 'flex';
  // Populate group select
  var sel = document.getElementById('ng-group');
  sel.innerHTML = '';
  getGroupList().forEach(function(g) {
    var opt = document.createElement('option'); opt.value = g; opt.textContent = g; sel.appendChild(opt);
  });
  document.getElementById('ng-name').focus();
}

function closeNewGuest() {
  document.getElementById('new-guest-modal').style.display = 'none';
}

async function saveNewGuest() {
  var name = document.getElementById('ng-name').value.trim();
  if (!name) { alert('נא למלא שם'); return; }
  var maxId = guests.reduce(function(m,g) { return Math.max(m, g.id||0); }, 0);
  var newGuest = {
    id: maxId + 1,
    name: name,
    count: parseInt(document.getElementById('ng-count').value) || 1,
    kids: parseInt(document.getElementById('ng-kids').value) || 0,
    phone: document.getElementById('ng-phone').value.trim(),
    group: document.getElementById('ng-group').value,
    status: document.getElementById('ng-status').value,
    invitation: false,
    uncertain: false,
    notes: ''
  };
  var res = await sb.from('guests').insert([newGuest]);
  if (res.error) { alert('שגיאה בשמירה'); return; }
  closeNewGuest();
  await init();
  showSaved();
}

function toggleCompact() {
  var body = document.body;
  var btn = document.getElementById('compact-btn');
  if (body.classList.contains('compact')) {
    body.classList.remove('compact');
    btn.textContent = '📱 מובייל';
  } else {
    body.classList.add('compact');
    btn.textContent = '🖥️ רגיל';
  }
}

init();

// Check for pending RSVP requests
async function checkRSVPBadge() {
  var res = await sb.from('rsvp_requests').select('id').eq('approved', false);
  var data = res.data || [];
  var badge = document.getElementById('rsvp-badge');
  if (data.length > 0) { badge.style.display = 'inline'; badge.textContent = data.length; }
}
checkRSVPBadge();
</script>

        <input id="ng-name" type="text" placeholder="שם האורח" style="width:100%;padding:0.6rem;border:2px solid #3D1F08;border-radius:4px;font-family:Rubik,sans-serif;font-size:0.9rem;direction:rtl;outline:none">
      </div>
      <div>
        <label style="font-family:'Barlow Condensed',sans-serif;font-size:0.6rem;letter-spacing:0.2em;color:#D4581A;text-transform:uppercase;display:block;margin-bottom:3px">כמה אנשים</label>
        <input id="ng-count" type="number" value="1" min="1" style="width:100%;padding:0.6rem;border:2px solid #3D1F08;border-radius:4px;font-family:Rubik,sans-serif;font-size:0.9rem;outline:none">
      </div>
      <div>
        <label style="font-family:'Barlow Condensed',sans-serif;font-size:0.6rem;letter-spacing:0.2em;color:#D4581A;text-transform:uppercase;display:block;margin-bottom:3px">ילדים</label>

      </div>
      <div>
        <label style="font-family:'Barlow Condensed',sans-serif;font-size:0.6rem;letter-spacing:0.2em;color:#D4581A;text-transform:uppercase;display:block;margin-bottom:3px">קבוצה</label>
        <select id="ng-group" style="width:100%;padding:0.6rem;border:2px solid #3D1F08;border-radius:4px;font-family:Rubik,sans-serif;font-size:0.9rem;direction:rtl;outline:none">
        </select>
      </div>
      <div>
        <label style="font-family:'Barlow Condensed',sans-serif;font-size:0.6rem;letter-spacing:0.2em;color:#D4581A;text-transform:uppercase;display:block;margin-bottom:3px">סטטוס</label>
        <select id="ng-status" style="width:100%;padding:0.6rem;border:2px solid #3D1F08;border-radius:4px;font-family:Rubik,sans-serif;font-size:0.9rem;direction:rtl;outline:none">
          <option value="טרם נשאל">טרם נשאל</option>
          <option value="מגיע">מגיע</option>
          <option value="לא מגיע">לא מגיע</option>
          <option value="לא בטוח">לא בטוח</option>
        </select>
      </div>
      <button onclick="saveNewGuest()" style="width:100%;padding:0.8rem;background:#4BAE8A;border:2px solid #3D1F08;border-radius:6px;font-family:Righteous,cursive;font-size:1rem;color:#fff;cursor:pointer;margin-top:0.5rem">שמור אורח</button>
    </div>
  </div>
</div>
