<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#F2E8D5;font-family:Rubik,sans-serif;direction:rtl;font-size:14px}
.pwd-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:1rem;background:#F2E8D5}
.pwd-screen h2{font-family:Righteous,cursive;font-size:2rem;color:#3D1F08}
.pwd-screen h2 span{color:#D4581A}
.pwd-screen input{padding:.8rem 1.2rem;border:3px solid #3D1F08;border-radius:6px;font-family:Rubik,sans-serif;font-size:1rem;outline:none;width:250px;text-align:center;direction:ltr}
.pwd-screen button{padding:.7rem 2rem;background:#D4581A;border:2px solid #3D1F08;border-radius:20px;font-family:Righteous,cursive;font-size:1rem;color:#FAF3E0;cursor:pointer}
.err{color:#D4581A;font-size:.85rem;display:none}
.admin{display:none}
.topbar{background:#3D1F08;padding:1rem 1.5rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.topbar-logo{font-family:Righteous,cursive;font-size:1.4rem;color:#FAF3E0}
.topbar-logo span{color:#E8A820}
.tabs{display:flex;border-bottom:3px solid #3D1F08;background:#F2E8D5}
.tab{padding:.8rem 1.5rem;font-family:Barlow Condensed,sans-serif;font-size:.75rem;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;color:#8B6A4A;border-bottom:3px solid transparent;margin-bottom:-3px}
.tab.active{color:#D4581A;border-bottom-color:#D4581A}
.tab-content{display:none;padding:1.5rem}
.tab-content.active{display:block}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:.8rem;margin-bottom:1.5rem}
.stat{background:#3D1F08;border-radius:8px;padding:1rem;text-align:center;border:2px solid #D4581A}
.stat-num{font-family:Righteous,cursive;font-size:2rem;color:#E8A820;display:block}
.stat-label{font-family:Barlow Condensed,sans-serif;font-size:.55rem;letter-spacing:.2em;color:rgba(242,232,213,.5);text-transform:uppercase;margin-top:.2rem;display:block}
.filters{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem;align-items:center}
.filter-select,.search-input{padding:.5rem .8rem;border:2px solid #3D1F08;background:#FAF3E0;font-family:Rubik,sans-serif;font-size:.8rem;border-radius:4px;outline:none;direction:rtl}
.search-input{flex:1;min-width:150px}
.export-btn{padding:.5rem 1rem;font-family:Barlow Condensed,sans-serif;font-size:.65rem;letter-spacing:.15em;text-transform:uppercase;border:2px solid #3D1F08;border-radius:20px;cursor:pointer;background:#FAF3E0}
.table-wrap{background:#FAF3E0;border:3px solid #3D1F08;border-radius:8px;overflow:auto}
table{width:100%;border-collapse:collapse;min-width:800px}
th{background:#3D1F08;color:#E8A820;font-family:Barlow Condensed,sans-serif;font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;padding:.8rem;text-align:right;white-space:nowrap}
td{padding:.6rem .8rem;border-bottom:1px solid rgba(61,31,8,.1);vertical-align:middle}
tr:hover td{background:rgba(212,88,26,.05)}
.badge{font-family:Barlow Condensed,sans-serif;font-size:.58rem;letter-spacing:.1em;padding:2px 8px;border-radius:20px;text-transform:uppercase;white-space:nowrap;border:1px solid #ddd;color:#555}
.badge-green{background:#4BAE8A;color:#fff;border-color:#4BAE8A}
.badge-red{background:#C03020;color:#fff;border-color:#C03020}
.badge-yellow{background:#E8A820;color:#3D1F08;border-color:#E8A820}
.badge-gray{background:#ddd;color:#666;border-color:#ccc}
.status-sel,.bool-sel{font-family:Rubik,sans-serif;font-size:.8rem;border:1px solid #ddd;border-radius:4px;padding:3px 6px;background:#fff;outline:none;cursor:pointer;direction:rtl}
.saved-msg{font-family:Barlow Condensed,sans-serif;font-size:.65rem;letter-spacing:.15em;text-transform:uppercase;padding:.4rem 1rem;background:#4BAE8A;color:#fff;border:none;border-radius:20px;opacity:0;transition:opacity .3s}
.saved-msg.show{opacity:1}
</style>
</head>

  document.getElementById('tab-btn-guests').classList.remove('active');
  document.getElementById('tab-lodging').classList.add('active');
  document.getElementById('tab-guests').classList.remove('active');
});

document.getElementById('search-input').addEventListener('input', filterGuests);
document.getElementById('filter-group').addEventListener('change', filterGuests);
document.getElementById('filter-status').addEventListener('change', filterGuests);
document.getElementById('export-btn').addEventListener('click', exportCSV);

function updateGuest(id, field, value) {
  var g = guests.find(function(x) { return x.id === id; });
  if (g) { g[field] = value; saveState(); updateStats(); }
}

function renderGuests(list) {
  var tbody = document.getElementById('guests-tbody');
  tbody.innerHTML = '';
  list.forEach(function(g) {
    var tr = document.createElement('tr');
    if (g.uncertain) tr.style.opacity = '0.5';

    var nameCell = document.createElement('td');
    nameCell.innerHTML = '<strong>' + g.name + '</strong>' + (g.uncertain ? ' <span style="color:#E8A820;font-size:0.75rem">?</span>' : '');
    
    var countCell = document.createElement('td');
    countCell.textContent = g.count;
    countCell.style.textAlign = 'center';

    var kidsCell = document.createElement('td');
    kidsCell.textContent = g.kids || '-';
    kidsCell.style.textAlign = 'center';

    var phoneCell = document.createElement('td');
    phoneCell.textContent = g.phone || '-';
    phoneCell.style.direction = 'ltr';
    phoneCell.style.fontSize = '0.8rem';

    var saveCell = document.createElement('td');
    saveCell.style.textAlign = 'center';
    var saveSelect = document.createElement('select');
    saveSelect.className = 'bool-sel';
    saveSelect.innerHTML = '<option value="1"' + (g.save_date ? ' selected' : '') + '>' + String.fromCharCode(1499,1503) + '</option><option value="0"' + (!g.save_date ? ' selected' : '') + '>' + String.fromCharCode(1500,1488) + '</option>';
    saveSelect.addEventListener('change', (function(id) { return function() { updateGuest(id, 'save_date', this.value === '1'); }; })(g.id));
    saveCell.appendChild(saveSelect);

    var invCell = document.createElement('td');
    invCell.style.textAlign = 'center';
    var invSelect = document.createElement('select');
    invSelect.className = 'bool-sel';
    invSelect.innerHTML = '<option value="1"' + (g.invitation ? ' selected' : '') + '>' + String.fromCharCode(1499,1503) + '</option><option value="0"' + (!g.invitation ? ' selected' : '') + '>' + String.fromCharCode(1500,1488) + '</option>';
    invSelect.addEventListener('change', (function(id) { return function() { updateGuest(id, 'invitation', this.value === '1'); }; })(g.id));
    invCell.appendChild(invSelect);

    var statusCell = document.createElement('td');
    var statusSelect = document.createElement('select');
    statusSelect.className = 'status-sel';
    var statuses = ['\u05de\u05d2\u05d9\u05e2', '\u05dc\u05d0 \u05de\u05d2\u05d9\u05e2', '\u05dc\u05d0 \u05e2\u05e0\u05d4', '\u05dc\u05d0 \u05d1\u05d8\u05d5\u05d7'];
    statuses.forEach(function(s) {
      var opt = document.createElement('option');
      opt.value = s;
      opt.textContent = s;
      if (g.status === s) opt.selected = true;
      statusSelect.appendChild(opt);
    });
    statusSelect.addEventListener('change', (function(id) { return function() { updateGuest(id, 'status', this.value); }; })(g.id));
    statusCell.appendChild(statusSelect);

    var groupCell = document.createElement('td');
    var badge = document.createElement('span');
    badge.className = 'badge';
    badge.textContent = g.group;
    groupCell.appendChild(badge);

    tr.appendChild(nameCell);
    tr.appendChild(countCell);
    tr.appendChild(kidsCell);
    tr.appendChild(phoneCell);
    tr.appendChild(saveCell);
    tr.appendChild(invCell);
    tr.appendChild(statusCell);
    tr.appendChild(groupCell);
    tbody.appendChild(tr);
  });
}

function updateStats() {
  var coming = guests.filter(function(g) { return g.status === '\u05de\u05d2\u05d9\u05e2'; });
  var notComing = guests.filter(function(g) { return g.status === '\u05dc\u05d0 \u05de\u05d2\u05d9\u05e2'; });
  var unknown = guests.filter(function(g) { return g.status === '\u05dc\u05d0 \u05e2\u05e0\u05d4'; });
  var totalPeople = coming.reduce(function(s,g) { return s + (g.count||0); }, 0);
  var invited = guests.filter(function(g) { return g.invitation; }).length;
  var totalAll = guests.reduce(function(s,g) { return s + (g.count||0); }, 0);

  var stats = document.getElementById('stats');
  stats.innerHTML = '';
  var items = [
    [guests.length, '\u05e1\u05d4"\u05db \u05d4\u05d6\u05de\u05e0\u05d5\u05ea', '#D4581A'],
    [totalAll, '\u05e1\u05d4"\u05db \u05d0\u05e0\u05e9\u05d9\u05dd', '#D4581A'],
    [coming.length, '\u05de\u05d2\u05d9\u05e2\u05d9\u05dd', '#4BAE8A'],
    [totalPeople, '\u05de\u05d2\u05d9\u05e2\u05d9\u05dd (\u05d0\u05e0\u05e9\u05d9\u05dd)', '#4BAE8A'],
    [notComing.length, '\u05dc\u05d0 \u05de\u05d2\u05d9\u05e2\u05d9\u05dd', '#C03020'],
    [unknown.length, '\u05dc\u05d0 \u05e2\u05e0\u05d5', '#8B6A4A'],
    [invited, '\u05e7\u05d9\u05d1\u05dc\u05d5 \u05d4\u05d6\u05de\u05e0\u05d4', '#E8A820'],
  ];
  items.forEach(function(item) {
    var div = document.createElement('div');
    div.className = 'stat';
    div.style.borderColor = item[2];
    var num = document.createElement('span');
    num.className = 'stat-num';
    num.style.color = item[2];
    num.textContent = item[0];
    var lbl = document.createElement('span');
    lbl.className = 'stat-label';
    lbl.textContent = item[1];
    div.appendChild(num);
    div.appendChild(lbl);
    document.getElementById('stats').appendChild(div);
  });
}

function filterGuests() {
  var search = document.getElementById('search-input').value.toLowerCase();
  var group = document.getElementById('filter-group').value;
  var status = document.getElementById('filter-status').value;
  var filtered = guests.filter(function(g) {
    if (search && g.name.toLowerCase().indexOf(search) === -1) return false;
    if (group && g.group !== group) return false;
    if (status && g.status !== status) return false;
    return true;
  });
  renderGuests(filtered);
}

function exportCSV() {
  var headers = ['name','count','kids','phone','save_date','invitation','status','group'];
  var rows = guests.map(function(g) {
    return headers.map(function(h) { return g[h]; }).join(',');
  });
  var csv = '﻿' + headers.join(',') + '
' + rows.join('
');
  var blob = new Blob([csv], {type: 'text/csv;charset=utf-8'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'snd_guests.csv';
  a.click();
}

async function loadLodging() {
  var res = await sb.from('lodging').select('*').order('created_at', {ascending: false});
  var data = res.data || [];
  
  var total = data.reduce(function(s,r) { return s + (parseInt(r.guests)||0); }, 0);
  var shared = data.filter(function(r) { return r.type==='shared'; }).reduce(function(s,r) { return s + (parseInt(r.guests)||0); }, 0);
  var priv = data.filter(function(r) { return r.type==='private'; }).reduce(function(s,r) { return s + (parseInt(r.guests)||0); }, 0);

  var ls = document.getElementById('lodging-stats');
  ls.innerHTML = '';
  [[total,'\u05e1\u05d4"\u05db \u05d9\u05e9\u05e0\u05d9\u05dd','#D4581A'],[data.length,'\u05e8\u05e9\u05d5\u05de\u05d5\u05ea','#D4581A'],[shared,'\u05d0\u05d5\u05d4\u05dc \u05de\u05e9\u05d5\u05ea\u05e3','#E8A820'],[priv,'\u05d0\u05d5\u05d4\u05dc \u05e4\u05e8\u05d8\u05d9','#6BB5D6']].forEach(function(item) {
    var div = document.createElement('div');
    div.className = 'stat';
    div.style.borderColor = item[2];
    var num = document.createElement('span');
    num.className = 'stat-num';
    num.style.color = item[2];
    num.textContent = item[0];
    var lbl = document.createElement('span');
    lbl.className = 'stat-label';
    lbl.textContent = item[1];
    div.appendChild(num);
    div.appendChild(lbl);
    ls.appendChild(div);
  });

  var wrap = document.getElementById('lodging-wrap');
  if (!data.length) {
    wrap.innerHTML = '<p style="padding:2rem;text-align:center;color:#8B6A4A">\u05d0\u05d9\u05df \u05e8\u05e9\u05d5\u05de\u05d5\u05ea \u05e2\u05d3\u05d9\u05d9\u05df</p>';
    return;
  }

  var table = document.createElement('table');
  var thead = document.createElement('thead');
  var hrow = document.createElement('tr');
  ['\u05e9\u05dd','\u05d0\u05e0\u05e9\u05d9\u05dd','\u05e1\u05d5\u05d2 \u05dc\u05d9\u05e0\u05d4','\u05d4\u05e2\u05e8\u05d5\u05ea','\u05ea\u05d0\u05e8\u05d9\u05da'].forEach(function(h) {
    var th = document.createElement('th');
    th.textContent = h;
    hrow.appendChild(th);
  });
  thead.appendChild(hrow);
  table.appendChild(thead);

  var tbody = document.createElement('tbody');
  data.forEach(function(r) {
    var tr = document.createElement('tr');
    var typeMap = {shared:'\u05d0\u05d5\u05d4\u05dc \u05de\u05e9\u05d5\u05ea\u05e3', private:'\u05d0\u05d5\u05d4\u05dc \u05e4\u05e8\u05d8\u05d9', sky:'\u05db\u05d9\u05e4\u05ea \u05d4\u05e9\u05de\u05d9\u05d9\u05dd'};
    var d = new Date(r.created_at);
    var dateStr = d.toLocaleDateString('he-IL');
    [r.name, r.guests, typeMap[r.type]||r.type, r.notes||'-', dateStr].forEach(function(val) {
      var td = document.createElement('td');
      td.textContent = val;
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  wrap.innerHTML = '';
  wrap.appendChild(table);
}
</script>
