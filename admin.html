<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guest List</title>
<link href="https://fonts.googleapis.com/css2?family=Righteous&family=Rubik:wght@300;400;700&family=Barlow+Condensed:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf8f5;--bg2:#f5f0ea;--bg3:#fff;--border:#e8e0d5;--border2:#ddd4c8;
  --text:#2c1f14;--text2:#8a7060;--text3:#b09880;
  --accent:#c8763a;--green:#1a5c33;--green-bg:#f0f8f2;--green-border:#c8e6d4;
  --red:#9c3820;--red-bg:#fdf4f0;--red-border:#f0c8b8;
  --badge-green-bg:#e8f5ee;--badge-muted-bg:#f5f0ea;--badge-muted-color:#8a7060;
}
body.dark-mode{
  --bg:#1c1510;--bg2:#241a12;--bg3:#241a12;--border:#3a2a1e;--border2:#4a3528;
  --text:#f0e8dc;--text2:#a08868;--text3:#6a5040;
  --accent:#c8763a;--green:#4ade80;--green-bg:#182818;--green-border:#1e4428;
  --red:#f87171;--red-bg:#281818;--red-border:#4a2020;
  --badge-green-bg:#1a3a22;--badge-muted-bg:#2a1e16;--badge-muted-color:#a08868;
}
*{margin:0;padding:0;box-sizing:border-box;transition:background .2s,color .2s,border-color .2s}
body{background:var(--bg);font-family:Rubik,sans-serif;direction:rtl;font-size:14px;padding:1rem;min-height:100vh}
.topbar{background:var(--bg2);padding:.9rem 1.25rem;display:flex;align-items:center;justify-content:space-between;border-radius:10px;margin-bottom:1rem;border:0.5px solid var(--border)}
.topbar-left{display:flex;align-items:center;gap:10px}
.topbar-logo-icon{width:30px;height:30px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:#fff;flex-shrink:0}
.topbar-logo{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:600;color:var(--text);letter-spacing:0.12em}
.topbar-right{display:flex;gap:6px;align-items:center}
.tabs{display:flex;border-bottom:0.5px solid var(--border);margin-bottom:1rem}
.tab{padding:.65rem 1.2rem;font-family:'Barlow Condensed',sans-serif;font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;color:var(--text3);border-bottom:2px solid transparent;margin-bottom:-0.5px;background:none;border-top:none;border-left:none;border-right:none;transition:color .2s}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:.7rem;margin-bottom:1.2rem;align-items:start}
.stat{background:var(--bg3);border-radius:8px;padding:.9rem 1rem;border:0.5px solid var(--border);cursor:pointer;transition:border-color .2s}
.stat:hover{border-color:var(--accent)}
.stat.active-filter{border-color:var(--accent);border-width:1.5px}
.stat-num{font-size:1.6rem;font-weight:600;color:var(--text);display:block;line-height:1.1}
.stat-label{font-family:'Barlow Condensed',sans-serif;font-size:.52rem;letter-spacing:.18em;color:var(--text3);text-transform:uppercase;margin-top:.2rem;display:block}
.stat.green{background:var(--green-bg);border-color:var(--green-border)}
.stat.green .stat-num{color:var(--green)}
.stat.red{background:var(--red-bg);border-color:var(--red-border)}
.stat.red .stat-num{color:var(--red)}
.filters{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem;align-items:center}
.filters input,.filters select{padding:.45rem .8rem;border:0.5px solid var(--border2);background:var(--bg3);color:var(--text);font-family:Rubik,sans-serif;font-size:.8rem;border-radius:6px;outline:none;direction:rtl}
.filters input:focus,.filters select:focus{border-color:var(--accent)}
.filters input{flex:1;min-width:150px}
.btn{padding:.45rem 1rem;font-family:'Barlow Condensed',sans-serif;font-size:.62rem;letter-spacing:.15em;text-transform:uppercase;border:0.5px solid var(--border2);border-radius:20px;cursor:pointer;background:var(--bg3);color:var(--text2);transition:all .2s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn-green{background:#2c7a4b;color:#fff;border-color:#2c7a4b}
.btn-green:hover{background:#235e3a;border-color:#235e3a;color:#fff}
.table-wrap{background:var(--bg3);border:0.5px solid var(--border);border-radius:10px;overflow:auto;max-height:65vh}
table{width:100%;border-collapse:collapse;min-width:750px}
th{background:var(--bg2);color:var(--text3);font-family:'Barlow Condensed',sans-serif;font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;padding:.7rem .8rem;text-align:right;white-space:nowrap;cursor:pointer;border-bottom:0.5px solid var(--border);position:sticky;top:0;z-index:10}
th:hover{color:var(--text)}
td{padding:.55rem .8rem;border-bottom:0.5px solid var(--bg2);vertical-align:middle;color:var(--text)}
tr:hover td{background:var(--bg2)}
.badge{font-family:'Barlow Condensed',sans-serif;font-size:.58rem;letter-spacing:.08em;padding:2px 8px;border-radius:20px;text-transform:uppercase;white-space:nowrap;font-weight:500}
.badge-coming{background:var(--badge-green-bg);color:var(--green)}
.badge-notcoming{background:var(--red-bg);color:var(--red)}
.badge-unknown{background:var(--badge-muted-bg);color:var(--badge-muted-color);border:0.5px solid var(--border)}
.badge-unsure{background:var(--badge-muted-bg);color:var(--text2);border:0.5px solid var(--border)}
select.inline{font-family:Rubik,sans-serif;font-size:.78rem;border:0.5px solid var(--border);border-radius:5px;padding:3px 6px;background:var(--bg3);color:var(--text);outline:none;cursor:pointer;direction:rtl;max-width:130px}
select.inline:focus{border-color:var(--accent)}
.loading{text-align:center;padding:2rem;color:var(--text3);font-family:Righteous,cursive;font-size:1.1rem}
.saved-msg{position:fixed;top:1rem;left:50%;transform:translateX(-50%);background:#2c7a4b;color:#fff;padding:.4rem 1.2rem;border-radius:20px;font-family:'Barlow Condensed',sans-serif;font-size:.65rem;letter-spacing:.15em;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999}
.row-num{color:var(--text3);font-size:.75rem;text-align:center;width:30px}
@media(max-width:768px){
  table{font-size:10px;table-layout:fixed;width:100%}
  td,th{padding:3px 4px !important}
  select.inline{font-size:10px !important;padding:1px 3px !important;max-width:75px !important}
  td:first-child,th:first-child{width:25px}
  td:nth-child(2),th:nth-child(2){width:80px}
  td:nth-child(3),th:nth-child(3){width:22px}
  td:nth-child(4),th:nth-child(4){width:22px}
  td:nth-child(5),th:nth-child(5){width:45px}
  td:nth-child(6),th:nth-child(6){width:80px}
  td:nth-child(7),th:nth-child(7){width:85px}
  td:nth-child(8),th:nth-child(8){width:40px}
  td:nth-child(9),th:nth-child(9){width:65px}
  .stat-num{font-size:1.2rem !important}
  body{padding:.4rem}
  .topbar{padding:.6rem .9rem}
}
.compact table{font-size:11px;table-layout:fixed;width:100%}
.compact td,.compact th{padding:4px 5px}
.compact select.inline{font-size:11px;padding:2px 3px;max-width:90px}
.compact .stat-num{font-size:1.2rem}
.edit-locked .btn-green{display:none}
.edit-locked select.inline{pointer-events:none;opacity:0.6;appearance:none;-webkit-appearance:none}
.edit-locked span[title="לחץ לעריכה"]{pointer-events:none !important;border-bottom:none !important;cursor:default !important}
.edit-locked .del-btn{display:none !important}
.edit-locked td[title="לחץ לעריכה"]{pointer-events:none !important;cursor:default !important}
.edit-locked td select{pointer-events:none;opacity:0.6;appearance:none;-webkit-appearance:none}
.edit-locked button.del-btn{display:none !important}
.edit-locked #compact-btn ~ button{display:none}
.lock-btn{position:fixed;bottom:1.5rem;left:1.5rem;z-index:999;background:var(--bg2);border:0.5px solid var(--border);color:var(--text2);padding:.5rem 1rem;border-radius:20px;font-family:Barlow Condensed,sans-serif;font-size:.65rem;letter-spacing:.15em;text-transform:uppercase;cursor:pointer}
.lock-btn.unlocked{border-color:#2c7a4b;color:#2c7a4b}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-logo">S<span>&</span>D FEST</div>
  <div style="display:flex;gap:.5rem"><button class="btn" onclick="openNewGuest()" style="background:#4BAE8A;color:#fff;border-color:#4BAE8A">+ אורח חדש</button><button class="btn" id="compact-btn" onclick="toggleCompact()">📱 מובייל</button><button class="btn" onclick="exportCSV()">ייצא CSV</button></div>
</div>
<div class="saved-msg" id="saved-msg">&#10003; נשמר</div>

<div class="tabs">
  <button class="tab active" id="tab-btn-guests" onclick="showTab('guests')">אישורי הגעה</button>
  <button class="tab" id="tab-btn-lodging" onclick="showTab('lodging')">לינה</button>
  <button class="tab" id="tab-btn-history" onclick="showTab('history')">היסטוריה</button>
  <button class="tab" id="tab-btn-budget" onclick="showTab('budget')">תקציב</button>
  <button class="tab" id="tab-btn-rsvp" onclick="showTab('rsvp')">בקשות <span id="rsvp-badge" style="background:#C03020;color:#fff;border-radius:20px;padding:1px 7px;font-size:.65rem;display:none">0</span></button>
</div>

<div id="pane-guests">
  <div class="stats" id="stats"><div class="loading">טוען...</div></div>
  <div class="filters">
    <input type="text" id="search" placeholder="חיפוש שם..." oninput="renderTable()">
    <select id="fgroup" onchange="renderTable()"><option value="">כל הקבוצות</option></select>
    <select id="fstatus" onchange="renderTable()">
      <option value="">כל הסטטוסים</option>
      <option>מגיע</option>
      <option>לא מגיע</option>
      <option>טרם נשאל</option>
      <option>לא בטוח</option>
    </select>
    <button class="btn" onclick="clearFilters()">נקה סינון</button>
  </div>
  <div class="table-wrap">
    <div id="gtable"><div class="loading">טוען אורחים...</div></div>
  </div>
</div>

<div id="pane-lodging" style="display:none">
  <div class="stats" id="lstats"></div>
  <div class="table-wrap" id="ltable"><div class="loading">טוען...</div></div>
</div>


<div id="pane-budget" style="display:none">

  <!-- Stats -->
  <div class="stats" id="budget-stats"></div>

  <!-- Add item button -->
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem">
    <button class="btn btn-green" onclick="openNewBudgetItem()" style="font-size:.65rem">+ הוסף סעיף</button>
  </div>

  <!-- Simulator -->
  <div style="background:var(--bg3);border:0.5px solid var(--border);border-radius:10px;padding:1.25rem;margin-bottom:1rem">
    <p style="font-family:Barlow Condensed,sans-serif;font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--text3);margin:0 0 .8rem">מחשבון אורחים נוספים</p>
    <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
      <div style="display:flex;align-items:center;gap:8px">
        <label style="font-size:.8rem;color:var(--text2)">אורחים נוספים:</label>
        <input type="number" id="extra-guests" value="0" min="0" max="500"
          style="width:70px;padding:5px 8px;border:0.5px solid var(--border);border-radius:6px;font-family:Rubik,sans-serif;font-size:.9rem;background:var(--bg);color:var(--text);outline:none;text-align:center"
          oninput="updateSimulator()">
      </div>
      <div id="simulator-result" style="display:flex;gap:10px;flex-wrap:wrap"></div>
    </div>
  </div>

  <!-- Big Gifts -->
  <div style="background:var(--bg3);border:0.5px solid var(--border);border-radius:10px;padding:1.25rem;margin-bottom:1rem">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.8rem">
      <p style="font-family:Barlow Condensed,sans-serif;font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--text3);margin:0">מתנות גדולות</p>
      <button class="btn" onclick="addGift()" style="font-size:.6rem;padding:3px 10px">+ הוסף מתנה</button>
    </div>
    <div id="gifts-list" style="display:flex;flex-direction:column;gap:6px"></div>
  </div>

  <!-- Table -->
  <div class="table-wrap">
    <table id="budget-table">
      <thead><tr>
        <th>#</th>
        <th>קטגוריה</th>
        <th>ספק</th>
        <th style="text-align:center">סכום כולל</th>
        <th style="text-align:center">מקדמה</th>
        <th style="text-align:center">יתרה</th>
        <th style="text-align:center">שולם</th>
        <th>הערות</th>
        <th></th>
      </tr></thead>
      <tbody id="budget-tbody"></tbody>
    </table>
  </div>
</div>

<!-- New Budget Item Modal -->
<div id="budget-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:1000;align-items:center;justify-content:center">
  <div style="background:var(--bg);border:0.5px solid var(--border);border-radius:10px;padding:2rem;width:90%;max-width:420px;direction:rtl;max-height:90vh;overflow-y:auto">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem">
      <h3 style="font-family:Righteous,cursive;color:var(--text);font-size:1.2rem">סעיף תקציב</h3>
      <button onclick="closeBudgetModal()" style="background:none;border:none;font-size:1.3rem;cursor:pointer;color:var(--text2)">✕</button>
    </div>
    <div style="display:flex;flex-direction:column;gap:.8rem">
      <div>
        <label style="font-family:'Barlow Condensed',sans-serif;font-size:.6rem;letter-spacing:.2em;color:var(--accent);text-transform:uppercase;display:block;margin-bottom:3px">קטגוריה</label>
        <input id="b-category" type="text" style="width:100%;padding:.6rem;border:0.5px solid var(--border);border-radius:6px;font-family:Rubik,sans-serif;font-size:.9rem;direction:rtl;background:var(--bg3);color:var(--text);outline:none">
      </div>
      <div>
        <label style="font-family:'Barlow Condensed',sans-serif;font-size:.6rem;letter-spacing:.2em;color:var(--accent);text-transform:uppercase;display:block;margin-bottom:3px">ספק</label>
        <input id="b-vendor" type="text" style="width:100%;padding:.6rem;border:0.5px solid var(--border);border-radius:6px;font-family:Rubik,sans-serif;font-size:.9rem;direction:rtl;background:var(--bg3);color:var(--text);outline:none">
      </div>
      <div>
        <label style="font-family:'Barlow Condensed',sans-serif;font-size:.6rem;letter-spacing:.2em;color:var(--accent);text-transform:uppercase;display:block;margin-bottom:3px">סכום כולל מע"מ (₪)</label>
        <input id="b-total" type="number" value="0" style="width:100%;padding:.6rem;border:0.5px solid var(--border);border-radius:6px;font-family:Rubik,sans-serif;font-size:.9rem;background:var(--bg3);color:var(--text);outline:none">
      </div>
      <div>
        <label style="font-family:'Barlow Condensed',sans-serif;font-size:.6rem;letter-spacing:.2em;color:var(--accent);text-transform:uppercase;display:block;margin-bottom:3px">מקדמה ששולמה (₪)</label>
        <input id="b-deposit" type="number" value="0" style="width:100%;padding:.6rem;border:0.5px solid var(--border);border-radius:6px;font-family:Rubik,sans-serif;font-size:.9rem;background:var(--bg3);color:var(--text);outline:none">
      </div>
      <div>
        <label style="font-family:'Barlow Condensed',sans-serif;font-size:.6rem;letter-spacing:.2em;color:var(--accent);text-transform:uppercase;display:block;margin-bottom:3px">הערות</label>
        <textarea id="b-notes" style="width:100%;padding:.6rem;border:0.5px solid var(--border);border-radius:6px;font-family:Rubik,sans-serif;font-size:.9rem;direction:rtl;background:var(--bg3);color:var(--text);outline:none;resize:vertical;min-height:60px"></textarea>
      </div>
      <button onclick="saveBudgetItem()" style="width:100%;padding:.8rem;background:#2c7a4b;border:none;border-radius:6px;font-family:Righteous,cursive;font-size:1rem;color:#fff;cursor:pointer">שמור</button>
    </div>
  </div>
</div>

<div id="pane-history" style="display:none">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem">
    <span style="font-family:Barlow Condensed,sans-serif;font-size:.7rem;letter-spacing:.15em;color:var(--text3);text-transform:uppercase">כל השינויים האחרונים</span>
    <button class="btn" onclick="loadHistory()">🔄 רענן</button>
  </div>
  <div class="table-wrap" id="history-table"><div class="loading">טוען...</div></div>
</div>

<div id="pane-rsvp" style="display:none">
  <div style="margin-bottom:1rem;font-family:Rubik,sans-serif;font-size:.85rem;color:#8B6A4A">
    בקשות ממתינות לאישור — בחרי את האורח המתאים ולחצי אשר.
  </div>
  <div id="rsvp-list"><div class="loading">טוען...</div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
var SB_URL = 'https://mvuachvkxkqwbpbzpczk.supabase.co';
var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im12dWFjaHZreGtxd2JwYnpwY3prIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY2NDMwMzIsImV4cCI6MjA5MjIxOTAzMn0.FIOx0kVsjY7UzchC7OJDGVr3fUBjjVZ4pfwBA8JyCJU';
var sb = supabase.createClient(SB_URL, SB_KEY);
var guests = [];
var lodgingData = [];
var sortCol = 'id';
var sortAsc = true;
var activeStatFilter = null;

async function init() {
  var res = await sb.from('guests').select('*').order('id');
  if (res.error) { document.getElementById('gtable').innerHTML = '<div class="loading">שגיאה בטעינת נתונים</div>'; return; }
  guests = res.data;
  // Populate group filter dynamically
  var fgroup = document.getElementById('fgroup');
  fgroup.innerHTML = '<option value="">כל הקבוצות</option>';
  var allGroups = getGroupList();
  allGroups.forEach(function(g) {
    var opt = document.createElement('option');
    opt.value = g; opt.textContent = g;
    fgroup.appendChild(opt);
  });
  var uncertainOpt = document.createElement('option');
  uncertainOpt.value = '__uncertain__'; uncertainOpt.textContent = 'טרם הוזמן';
  fgroup.appendChild(uncertainOpt);
  var lRes = await sb.from('lodging').select('name,guests,type');
  lodgingData = lRes.data || [];
  renderStats();
  renderTable();
}

function showSaved() {
  var m = document.getElementById('saved-msg');
  m.style.opacity = '1';
  setTimeout(function() { m.style.opacity = '0'; }, 1500);
}


async function logAudit(guestId, guestName, field, oldValue, newValue, action) {
  var res = await sb.from('audit_log').insert([{
    editor_name: currentUser.name || 'unknown',
    guest_id: guestId ? parseInt(guestId) : null,
    guest_name: guestName || '',
    field: field || '',
    old_value: oldValue !== undefined && oldValue !== null ? String(oldValue) : '',
    new_value: newValue !== undefined && newValue !== null ? String(newValue) : '',
    action: action || 'update'
  }]);
  if (res.error) console.error('Audit log error:', res.error);
}

async function updateGuest(id, field, val) {
  if (!isEditMode()) return;
  var g = guests.find(function(x) { return x.id === id; });
  var oldVal = g ? g[field] : '';
  var update = {};
  update[field] = val;
  await sb.from('guests').update(update).eq('id', parseInt(id));
  if (g) g[field] = val;
  logAudit(id, g ? g.name : '', field, oldVal, val, 'update');
  showSaved();
  renderStats();
}

function filterByStatus(status) {
  if (activeStatFilter === status) {
    activeStatFilter = null;
    document.getElementById('fstatus').value = '';
  } else {
    activeStatFilter = status;
    document.getElementById('fstatus').value = status;
  }
  renderStats();
  renderTable();
}

function renderStats() {
  var coming = guests.filter(function(g) { return g.status === 'מגיע'; });
  var nc = guests.filter(function(g) { return g.status === 'לא מגיע'; });
  var unk = guests.filter(function(g) { return g.status === 'לא ענה' || g.status === 'טרם נשאל'; });
  var total = guests.reduce(function(s, g) { return s + (g.count || 0); }, 0);
  var cp = coming.reduce(function(s, g) { return s + (g.count || 0); }, 0);
  var totalKids = guests.filter(function(g){return g.status==='מגיע';}).reduce(function(s,g) { return s + (parseInt(g.kids)||0); }, 0);
  var smsCount = guests.filter(function(g){return g.send_rsvp;}).length;

  var items = [
    {num: guests.length + ' / ' + total, label: 'הזמנות / אנשים', color: '#D4581A', filter: null},
    {num: cp, label: 'מגיעים (אנשים)', color: '#4BAE8A', filter: 'מגיע'},
    {num: nc.length, label: 'לא מגיעים', color: '#C03020', filter: 'לא מגיע'},
    {num: unk.length, label: 'טרם נשאלו', color: '#8B6A4A', filter: 'טרם נשאל'},
    {num: totalKids, label: 'ילדים', color: '#6BB5D6', filter: null},
    {num: smsCount, label: 'לשלוח SMS', color: '#8B5CF6', filter: '__sms__'},
  ];

  var s = document.getElementById('stats');
  s.innerHTML = '';
  items.forEach(function(item) {
    var d = document.createElement('div');
    d.className = 'stat' + (activeStatFilter === item.filter && item.filter ? ' active-filter' : '');
    d.style.borderColor = item.color;
    if (item.filter) d.onclick = function() { filterByStatus(item.filter); };
    d.innerHTML = '<span class="stat-num" style="color:' + item.color + '">' + item.num + '</span><span class="stat-label">' + item.label + '</span>';
    s.appendChild(d);
  });
}

function sortBy(col) {
  if (sortCol === col) sortAsc = !sortAsc;
  else { sortCol = col; sortAsc = true; }
  renderTable();
}

function getGroupList() {
  var base = ['חברים','משפחה','עבודה','משפחת אייזנר','משפחת עזר','חברים של שי','אופיר','עדי','אלעד','שיר'];
  var fromData = guests.map(function(g) { return g.group; }).filter(Boolean);
  fromData.forEach(function(g) { if (base.indexOf(g) === -1) base.push(g); });
  return base;
}

function addCustomGroup(name) {
  // Update filter dropdown
  var fgroup = document.getElementById('fgroup');
  var exists = Array.from(fgroup.options).some(function(o) { return o.value === name; });
  if (!exists) {
    var opt = document.createElement('option');
    opt.value = name; opt.textContent = name;
    fgroup.insertBefore(opt, fgroup.lastElementChild);
  }
}

function getFiltered() {
  var search = document.getElementById('search').value.toLowerCase();
  var fg = document.getElementById('fgroup').value;
  var fs = document.getElementById('fstatus').value;
  return guests.filter(function(g) {
    if (search && g.name.toLowerCase().indexOf(search) === -1) return false;
    if (fg === '__uncertain__' && !g.uncertain) return false;
    if (fg === '__sms__' && !g.send_rsvp) return false;
    if (fg && fg !== '__uncertain__' && fg !== '__sms__' && g.group !== fg) return false;
    if (fs && g.status !== fs) return false;
    return true;
  });
}

function renderTable() {
  var list = getFiltered();

  list.sort(function(a, b) {
    var av = a[sortCol], bv = b[sortCol];
    if (av === null || av === undefined) av = '';
    if (bv === null || bv === undefined) bv = '';
    if (typeof av === 'string') av = av.toLowerCase();
    if (typeof bv === 'string') bv = bv.toLowerCase();
    if (av < bv) return sortAsc ? -1 : 1;
    if (av > bv) return sortAsc ? 1 : -1;
    return 0;
  });

  var cols = [
    {label: '#', key: 'rownum', center: true},
    {label: 'שם', key: 'name'},
    {label: '#', key: 'count', center: true},
    {label: 'ילדים', key: 'kids', center: true},
    {label: 'לשלוח SMS', key: 'send_rsvp', center: true},
    {label: 'סטטוס', key: 'status'},
    {label: 'קבוצה', key: 'group'},

  var table = document.createElement('table');

  thead.appendChild(hrow);

  var tbody = document.createElement('tbody');

  list.forEach(function(g) {

      [['1','כן'],['0','לא']].forEach(function(o) {
        var opt = document.createElement('option');
        opt.value = o[0]; opt.textContent = o[1];

        sel.appendChild(opt);
      });

      return sel;
    };

    var makeStatus = function(val) {
      var sel = document.createElement('select');
      sel.className = 'inline';
      [['מגיע','✓ מגיע'],['לא מגיע','✗ לא מגיע'],['טרם נשאל','⏳ טרם נשאל'],['לא בטוח','~ לא בטוח']].forEach(function(o) {

            td.replaceChild(input, span);

            input.select();
            var done = false;
            function doSave() {
              if (!isEditMode()) { if (input.parentNode === td) td.replaceChild(span, input); return; }
              if (done) return;
              done = true;
              var raw = input.value.trim();
              if (raw !== '') {
                var finalVal = numeric ? (parseInt(raw)||0) : raw;

              if (input.parentNode === td) td.replaceChild(span, input);
            }
            input.addEventListener('keydown', function(e) {

          });
          td.appendChild(span);

      }
      else { td.textContent = c.content !== undefined ? c.content : ''; if (c.bold) td.style.fontWeight = '500'; if (c.style) td.style.cssText += ';' + c.style; }

        delBtn.title = 'מחק רשומה';
        (function(gid, gname) {

            input.value = current;

function updateSimulator() {
  var extra = parseInt(document.getElementById('extra-guests').value) || 0;
  var FREE_EXTRA = 20; // first 20 are free
  var CATERING_PER = 310;
  var INCOME_PER = 550;

  var cateringCost = extra > FREE_EXTRA ? (extra - FREE_EXTRA) * CATERING_PER : 0;
  var extraIncome = extra * INCOME_PER;
  var net = extraIncome - cateringCost;

  var result = document.getElementById('simulator-result');
  result.innerHTML = '';

  function chip(label, val, danger) {
    var d = document.createElement('div');
    d.style.cssText = 'background:var(--bg2);border-radius:6px;padding:5px 10px;border:0.5px solid '+(danger&&val<0?'var(--red)':val>0?'var(--green)':'var(--border)')+';';
    d.innerHTML = '<span style="font-size:.7rem;color:var(--text3);display:block">'+label+'</span><span style="font-size:.95rem;font-weight:500;color:'+(val<0?'var(--red)':val>0?'var(--green)':'var(--text)')+'">'+formatMoney(val)+'</span>';
    result.appendChild(d);
  }

  if (extra > 0) {
    chip('עלות קייטרינג', -cateringCost, true);
    chip('הכנסה צפויה', extraIncome, false);
    chip('נטו', net, true);
  }

  // Re-render budget with new extra guests factored in
  window._extraGuests = extra;
  renderBudget();
}

async function addGift() {
  if (!isEditMode()) { alert('עברי למצב עריכה קודם'); return; }
  var name = prompt('שם הנותן (נגיד: הורי שי):');
  if (!name) return;
  var amount = prompt('סכום המתנה (₪):');
  if (!amount) return;
  amount = parseFloat(amount) || 0;
  var maxId = (window._bigGifts.reduce(function(m,g){return Math.max(m,g.id||0);},0));
  var newGift = {id: maxId+1, name: name.trim(), amount: amount};
  var res = await sb.from('budget_gifts').insert([newGift]);
  if (!res.error) {
    window._bigGifts.push(newGift);
    renderGifts();
    renderBudget();
    showSaved();
  }
}

async function deleteGift(id) {
  if (!isEditMode()) return;
  if (!confirm('למחוק מתנה?')) return;
  await sb.from('budget_gifts').delete().eq('id', parseInt(id));
  window._bigGifts = window._bigGifts.filter(function(g){return g.id!==id;});
  renderGifts();
  renderBudget();
  showSaved();
}

// ===== BUDGET =====
var budgetItems = [];

async function loadBudgetFromDB() {
  var res = await sb.from('budget').select('*').order('id');
  if (res.error) { console.error('Budget load error:', res.error); return; }
  budgetItems = res.data || [];
  await loadGifts();
  // Refresh guests data to get latest coming count
  if (!guests || guests.length === 0) {
    var gRes = await sb.from('guests').select('*').order('id');
    if (!gRes.error) guests = gRes.data || [];
  }
  renderBudget();
}

async function updateBudgetInDB(id, field, val) {
  if (!isEditMode()) return;
  var upd = {}; upd[field] = val;
  var res = await sb.from('budget').update(upd).eq('id', parseInt(id));
  if (res.error) { console.error('Budget update error:', res.error); return; }
  var item = budgetItems.find(function(i){return i.id===id;});
  if (item) item[field] = val;
  showSaved();
  renderBudget();
}

async function deleteBudgetFromDB(id) {
  if (!isEditMode()) return;
  await sb.from('budget').delete().eq('id', parseInt(id));
  budgetItems = budgetItems.filter(function(i){return i.id!==id;});
  renderBudget();
  showSaved();
}

async function insertBudgetToDB(item) {
  var res = await sb.from('budget').insert([item]);
  if (res.error) { alert('שגיאה בשמירה'); return false; }
  return true;
}

function renderBudget() {
  var total = budgetItems.reduce(function(s,i){return s+(parseFloat(i.total_vat)||0);},0);
  var deposits = budgetItems.reduce(function(s,i){return s+(parseFloat(i.deposit)||0);},0);
  var paidTotal = budgetItems.filter(function(i){return i.paid;}).reduce(function(s,i){return s+(parseFloat(i.total_vat)||0);},0);

  var comingPeople = guests.filter(function(g){return g.status==='מגיע';}).reduce(function(s,g){return s+(g.count||0);},0);
  var GIFT_PER_PERSON = 550;
  var expectedIncome = comingPeople * GIFT_PER_PERSON;
  var gap = expectedIncome - total;

  var remaining = total - deposits;

  var bigGifts = (window._bigGifts || []).reduce(function(s,g){return s+(parseFloat(g.amount)||0);},0);
  var extra = window._extraGuests || 0;
  var FREE_LIMIT = 320;
  var CATERING_PER = 310;
  var INCOME_PER = 550;
  var totalWithExtra = comingPeople + extra;
  var extraCatering = totalWithExtra > FREE_LIMIT ? (totalWithExtra - FREE_LIMIT) * CATERING_PER : 0;
  var extraIncome = extra * INCOME_PER;
  var totalIncome = expectedIncome + bigGifts + extraIncome;
  var totalExpenses = total + extraCatering;
  var finalGap = totalIncome + deposits - totalExpenses;

  var statsEl = document.getElementById('budget-stats');
  statsEl.innerHTML = '';

  function makeSection(title) {
    var wrap = document.createElement('div');
    wrap.style.cssText = 'background:var(--bg3);border:0.5px solid var(--border);border-radius:10px;padding:1.25rem;margin-bottom:.8rem;';
    var lbl = document.createElement('p');
    lbl.style.cssText = 'font-family:Barlow Condensed,sans-serif;font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--text3);margin:0 0 .8rem;';
    lbl.textContent = title;
    wrap.appendChild(lbl);
    var grid = document.createElement('div');
    grid.style.cssText = 'display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;';
    wrap.appendChild(grid);
    statsEl.appendChild(wrap);
    return grid;
  }

  function makeCard(grid, num, label, danger) {
    var d = document.createElement('div');
    d.style.cssText = 'background:var(--bg2);border-radius:8px;padding:.9rem 1rem;' + (danger ? 'border:0.5px solid var(--red);' : '');
    d.innerHTML = '<span style="display:block;font-size:1.3rem;font-weight:600;color:'+(danger?'var(--red)':'var(--text)')+'">'+num+'</span><span style="font-size:.55rem;font-family:Barlow Condensed,sans-serif;letter-spacing:.15em;text-transform:uppercase;color:var(--text3)">'+label+'</span>';
    grid.appendChild(d);
  }

  var expGrid = makeSection('הוצאות');
  makeCard(expGrid, formatMoney(totalExpenses), 'סה"כ תקציב' + (extra > 0 ? ' (+' + extra + ' אורחים)' : ''), false);
  makeCard(expGrid, formatMoney(deposits), 'מקדמות שולמו', false);
  makeCard(expGrid, formatMoney(remaining), 'יתרה לתשלום', remaining > 0);

  var incGrid = makeSection('הכנסות');
  makeCard(incGrid, formatMoney(expectedIncome + extraIncome), (comingPeople + extra) + ' אנשים × 550₪', false);
  if (bigGifts > 0) makeCard(incGrid, formatMoney(bigGifts), 'מתנות גדולות', false);
  makeCard(incGrid, (finalGap >= 0 ? '+' : '') + formatMoney(finalGap), finalGap >= 0 ? 'עודף צפוי' : 'גירעון צפוי', finalGap < 0);

  var tbody = document.getElementById('budget-tbody');
  tbody.innerHTML = '';
  budgetItems.forEach(function(item, idx) {
    var remaining = (parseFloat(item.total_vat)||0) - (parseFloat(item.deposit)||0);
    if (item.paid) remaining = 0;
    var tr = document.createElement('tr');
    if (item.paid) tr.style.opacity = '0.5';

    var cells = [
      {txt: idx+1, center: true, muted: true, small: true},
      {editable: true, field: 'category', val: item.category || ''},
      {editable: true, field: 'vendor', val: item.vendor || '', muted: true},
      {editable: true, field: 'total_vat', val: parseFloat(item.total_vat)||0, numeric: true, center: true},
      {editable: true, field: 'deposit', val: parseFloat(item.deposit)||0, numeric: true, center: true, color: '#8B5CF6'},
      {txt: formatMoney(remaining), center: true, color: remaining > 0 ? 'var(--red)' : 'var(--green)'},
      {checkbox: true, field: 'paid', checked: item.paid},
      {editable: true, field: 'notes', val: item.notes || '', muted: true, small: true},
      {del: true, id: item.id},
    ];

    cells.forEach(function(c) {
      var td = document.createElement('td');
      if (c.center) td.style.textAlign = 'center';
      if (c.muted) td.style.color = 'var(--text3)';
      if (c.small) td.style.fontSize = '.8rem';
      if (c.color) td.style.color = c.color;

      if (c.txt !== undefined) {
        td.textContent = c.txt;
      } else if (c.checkbox) {
        var cb = document.createElement('input');
        cb.type = 'checkbox'; cb.checked = !!c.checked;
        cb.style.cssText = 'width:16px;height:16px;cursor:pointer;accent-color:var(--accent);';
        (function(itemId, field) {
          cb.onchange = function() { updateBudgetInDB(itemId, field, this.checked); };
        })(item.id, c.field);
        td.appendChild(cb);
      } else if (c.del) {
        var btn = document.createElement('button');
        btn.className = 'btn del-btn'; btn.textContent = '×';
        btn.style.cssText = 'padding:2px 7px;font-size:.7rem;border-color:#C03020;color:#C03020;';
        (function(itemId) {
          btn.onclick = function() {
            if (!isEditMode()) return;
            if (!confirm('למחוק סעיף?')) return;
            deleteBudgetFromDB(itemId);
          };
        })(c.id);
        td.appendChild(btn);
      } else if (c.editable) {
        var span = document.createElement('span');
        var displayVal = c.numeric ? formatMoney(c.val) : (c.val || '—');
        span.textContent = displayVal;
        span.style.cssText = 'cursor:pointer;border-bottom:0.5px dashed var(--border);';
        (function(itemId, field, span, td, numeric) {
          span.onclick = function() {
            if (!isEditMode()) return;
            var input = document.createElement('input');
            input.type = numeric ? 'number' : 'text';
            var currentItem = budgetItems.find(function(i){return i.id===itemId;});
            input.value = numeric ? (parseFloat((currentItem||{})[field])||0) : ((currentItem||{})[field]||'');
            input.style.cssText = 'font-family:Rubik,sans-serif;font-size:.85rem;border:1px solid var(--accent);border-radius:4px;padding:2px 6px;width:'+(numeric?'90px':'130px')+';background:var(--bg3);color:var(--text);outline:none;';
            td.replaceChild(input, span);
            input.focus(); input.select();
            var done = false;
            function doSave() {
              if (done) return; done = true;
              var val = numeric ? (parseFloat(input.value)||0) : input.value.trim();
              span.textContent = numeric ? formatMoney(val) : (val || '—');
              if (input.parentNode === td) td.replaceChild(span, input);
              updateBudgetInDB(itemId, field, val);
            }
            input.addEventListener('keydown', function(e) {
              if (e.key==='Enter'){e.preventDefault();doSave();}
              if (e.key==='Escape'){done=true;if(input.parentNode===td)td.replaceChild(span,input);}
            });
            input.addEventListener('blur', doSave);
          };
        })(item.id, c.field, span, td, c.numeric);
        td.appendChild(span);
      }
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
}

function formatMoney(n) {
  return (Math.round(n||0)).toLocaleString('he-IL') + '₪';
}

  document.getElementById('tab-btn-budget').classList.toggle('active', tab === 'budget');

var EDITOR_PASSWORD = 'ניקניק';
var ADMIN_PASSWORD = 'ניקניק פרוס';
var currentUser = {role: 'viewer', name: ''};

function initEditMode() {
  try {
    var saved = localStorage.getItem('snd_user_v2');
    if (saved) {
      var u = JSON.parse(saved);
      currentUser = u;
      setUserMode(u.role, u.name);
      return;
    }
  } catch(e) {}
  setUserMode('viewer', '');
}

function setUserMode(role, name) {
  currentUser = {role: role, name: name};
  var btn = document.getElementById('lock-btn');
  var budgetTab = document.getElementById('tab-btn-budget');
  if (role === 'admin') {
    document.body.classList.remove('edit-locked');
    if (btn) { btn.textContent = '👑 אדמין' + (name ? ' · ' + name : ''); btn.classList.add('unlocked'); }
    if (budgetTab) budgetTab.style.display = '';
  } else if (role === 'editor') {
    document.body.classList.remove('edit-locked');
    if (btn) { btn.textContent = '✏️ עורך' + (name ? ' · ' + name : ''); btn.classList.add('unlocked'); }
    if (budgetTab) budgetTab.style.display = 'none';
  } else {
    document.body.classList.add('edit-locked');
    if (btn) { btn.textContent = '🔒 צפייה בלבד'; btn.classList.remove('unlocked'); }
    if (budgetTab) budgetTab.style.display = 'none';
  }
}

function isEditMode() {
  return currentUser.role === 'admin' || currentUser.role === 'editor';
}

function isAdmin() {
  return currentUser.role === 'admin';
}

function toggleEdit() {
  if (currentUser.role !== 'viewer') {
    // Logout
    localStorage.removeItem('snd_user_v2');
    currentUser = {role: 'viewer', name: ''};
    setUserMode('viewer', '');
    return;
  }
  var pwd = prompt('סיסמה:');
  if (!pwd) return;
  if (pwd === ADMIN_PASSWORD) {
    var name = prompt('שמך:') || 'אדמין';
    currentUser = {role: 'admin', name: name};
    localStorage.setItem('snd_user_v2', JSON.stringify(currentUser));
    setUserMode('admin', name);
  } else if (pwd === EDITOR_PASSWORD) {
    var name = prompt('שמך (כדי שנדע מי ביצע שינויים):');
    if (!name) { alert('נא להכניס שם'); return; }
    currentUser = {role: 'editor', name: name};
    localStorage.setItem('snd_user_v2', JSON.stringify(currentUser));
    setUserMode('editor', name);
  } else {
    alert('סיסמה שגויה');
  }
}

        <input id="ng-phone" type="text" placeholder="050-0000000" style="width:100%;padding:0.6rem;border:2px solid #3D1F08;border-radius:4px;font-family:Rubik,sans-serif;font-size:0.9rem;direction:ltr;outline:none">

      <div>

        <select id="ng-group" style="width:100%;padding:0.6rem;border:2px solid #3D1F08;border-radius:4px;font-family:Rubik,sans-serif;font-size:0.9rem;direction:rtl;outline:none">

  </div>
</div>
